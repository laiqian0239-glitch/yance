<!doctype html><html><head><meta charset="utf-8"><style>
:root{--border-active:#6cf;--surface-card:#172033;--surface-control:#202b42;--accent-primary:#7de;--accent-secondary:#b8f;--shadow-base:#000;--status-success:#4d8;--status-warning:#fb5;--status-danger:#f66;--cyan:#6cf;--panel:#111827;--bg:#090e18;--theme-border-strong:#456;--theme-control-bg:#1b2538;--text:#eef;--theme-card-bg:#172033;--theme-text-soft:#abc}
*{box-sizing:border-box}html,body{width:1512px;height:931px;margin:0}.app{width:100%;height:100%;display:grid;grid-template-columns:70px minmax(0,1fr)}.workspace{grid-column:2;min-width:0;height:100%}.sc32-summary{display:grid}.sc32-stat,.contact26-stats>article,.aiw30-tab{border:1px solid;padding:4px}.sc32-body{display:grid}.sc32-nav button,.sr32-side button{display:grid}.aiwork-workspace,.insights-workspace{grid-column:2;width:100%;min-width:0}.aiw30-body{width:100%}.insight29-main{display:grid;grid-template-columns:280px minmax(0,1fr)}.insight29-detail{height:350px}.insight29-detail-hero{display:block}.insight29-detail-scroll{height:200px}.display-settings-panel{position:fixed;left:80px;bottom:10px;width:350px;border:1px solid;padding:14px}.display-note{padding:10px}.diagnostic-trigger{height:38px}.aiw30-sidebar{display:grid}.aiw30-tabs{display:grid}
</style><link rel="stylesheet" href="../../frontend/r32-production-workspace-layout.css"></head><body>
<div class="app system-center-open">
 <aside></aside><main class="workspace system-center-workspace">
  <header class="sc32-hero"><div class="sc32-title"><h1>系统中心</h1><p>状态说明</p></div></header><div class="product-area-subnav"></div>
  <section class="sc32-summary"><article class="sc32-stat"><span>指标</span><b>0</b><small>详情</small></article><article class="sc32-stat"><span>指标</span><b>1</b><small>详情</small></article><article class="sc32-stat"><span>指标</span><b>2</b><small>详情</small></article><article class="sc32-stat"><span>指标</span><b>3</b><small>详情</small></article><article class="sc32-stat"><span>指标</span><b>4</b><small>详情</small></article><article class="sc32-stat"><span>指标</span><b>5</b><small>详情</small></article><article class="sc32-stat"><span>指标</span><b>6</b><small>详情</small></article></section>
  <section class="sc32-body"><aside class="sc32-sidebar"><nav class="sc32-nav"><button><i>0</i><b>模块0</b><small>说明</small></button><button><i>1</i><b>模块1</b><small>说明</small></button><button><i>2</i><b>模块2</b><small>说明</small></button><button><i>3</i><b>模块3</b><small>说明</small></button><button><i>4</i><b>模块4</b><small>说明</small></button><button><i>5</i><b>模块5</b><small>说明</small></button><button><i>6</i><b>模块6</b><small>说明</small></button><button><i>7</i><b>模块7</b><small>说明</small></button><button><i>8</i><b>模块8</b><small>说明</small></button></nav></aside><div class="sc32-content">content</div></section>
 </main>
</div>
<div class="app insights-page-open" style="position:absolute;left:-5000px;top:0;width:1200px;height:700px"><main class="insights-workspace"><div></div><div></div><div></div><section class="insight29-main"><aside class="insight29-directory"></aside><article class="insight29-detail"><header class="insight29-detail-hero"><div style="height:72px">hero</div></header><div class="insight29-detail-scroll">detail</div></article></section></main></div>
<div class="app aiwork-page-open" style="position:absolute;left:-5000px;top:750px;width:1200px;height:700px"><main class="aiwork-workspace"><div></div><div></div><section class="aiw30-body"><aside class="aiw30-sidebar"><div class="aiw30-core">core</div><nav class="aiw30-tabs"><button class="aiw30-tab"><span>标签0</span><small>说明</small></button><button class="aiw30-tab"><span>标签1</span><small>说明</small></button><button class="aiw30-tab"><span>标签2</span><small>说明</small></button><button class="aiw30-tab"><span>标签3</span><small>说明</small></button><button class="aiw30-tab"><span>标签4</span><small>说明</small></button><button class="aiw30-tab"><span>标签5</span><small>说明</small></button><button class="aiw30-tab"><span>标签6</span><small>说明</small></button><button class="aiw30-tab"><span>标签7</span><small>说明</small></button><button class="aiw30-tab"><span>标签8</span><small>说明</small></button><button class="aiw30-tab"><span>标签9</span><small>说明</small></button></nav><div class="aiw30-activity">activity</div><div class="aiw30-sidebar-foot">foot</div></aside><div class="aiw30-content"></div></section></main></div>
<section class="display-settings-panel"><header><div><h3>阅读与界面密度</h3><p>设置说明</p></div></header><div class="display-group">字体</div><div class="display-group">密度</div><div class="display-note">当前设置已全局覆盖所有正式页面与弹窗；只调整字号、行高和密度，不改变功能结构。</div><button class="diagnostic-trigger">运行系统诊断</button></section>
<pre id="result"></pre><script>
const rect=e=>{const r=e.getBoundingClientRect();return {top:r.top,bottom:r.bottom,left:r.left,right:r.right,width:r.width,height:r.height}};
const stats=[...document.querySelectorAll('.sc32-stat')],statTops=[...new Set(stats.map(x=>Math.round(rect(x).top)))];
const side=document.querySelector('.sc32-sidebar'),buttons=[...document.querySelectorAll('.sc32-nav button')];
const hero=document.querySelector('.insight29-detail-hero'),note=document.querySelector('.display-note'),diag=document.querySelector('.diagnostic-trigger'),tabs=[...document.querySelectorAll('.aiw30-tab')],aiSide=document.querySelector('.aiw30-sidebar');
const overlaps=(a,b)=>a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top;
const tabRects=tabs.map(rect);let tabOverlap=false;for(let i=0;i<tabRects.length;i++)for(let j=i+1;j<tabRects.length;j++)if(overlaps(tabRects[i],tabRects[j]))tabOverlap=true;
const result={summarySingleRow:statTops.length===1,summaryCards:stats.length,systemCommandsReachable:buttons.every(b=>rect(b).bottom<=rect(side).bottom+1&&rect(b).top>=rect(side).top-1),systemCommandCount:buttons.length,detailHeroHasNoInnerScroll:hero.scrollHeight<=hero.clientHeight+1,displayPanelNoOverlap:rect(diag).top>=rect(note).bottom,aiTabsVisible:tabs.every(t=>rect(t).bottom<=rect(aiSide).bottom+1),aiTabOverlap:tabOverlap,aiTabCount:tabs.length};
document.getElementById('result').textContent=JSON.stringify(result);
</script></body></html>
