<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">言策 Yance 品牌标识母版</title>
  <desc id="desc">对话框轮廓、几何化言字和向右箭头组成的言策品牌标识。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2E31"/>
      <stop offset="1" stop-color="#0B1416"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E6ECEC"/>
      <stop offset="1" stop-color="#8A9499"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3DD9D0"/>
      <stop offset="1" stop-color="#17BDB5"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.239  0 0 0 0 0.851  0 0 0 0 0.816  0 0 0 .32 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="70" y="70" width="884" height="884" rx="218" fill="url(#bg)" stroke="#17BDB5" stroke-width="14"/>
  <rect x="94" y="94" width="836" height="836" rx="198" fill="none" stroke="#E6ECEC" stroke-opacity=".18" stroke-width="4"/>
  <g filter="url(#softGlow)">
    <path d="M250 292H686V244L824 356 686 468V420H250Z" fill="url(#metal)" stroke="url(#cyan)" stroke-width="8" stroke-linejoin="round"/>
    <rect x="292" y="492" width="382" height="68" rx="24" fill="url(#metal)" stroke="url(#cyan)" stroke-width="7"/>
    <path d="M304 612H676Q704 612 704 640V774Q704 802 676 802H430L330 876 356 802H304Q276 802 276 774V640Q276 612 304 612Z" fill="none" stroke="url(#metal)" stroke-width="58" stroke-linejoin="round"/>
    <path d="M319 610H679" stroke="url(#cyan)" stroke-opacity=".85" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
