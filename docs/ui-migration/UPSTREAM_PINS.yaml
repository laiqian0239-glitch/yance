  commit: bdcc04017fd79a494ba66fad83f762a1c714ff1a
  tree: f0d24bed8ca3ca132e47777a8a4dedd3cd521d09
  activeHandoffObserved: 89056a4466aa46fe282787980cf5029531fe76d6
  observationSemantics: historical-observation-require-fresh-remote-ref-read
