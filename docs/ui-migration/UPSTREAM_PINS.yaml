    package: reka-ui
    version: "2.9.7"
    license: MIT
    adoption: exact-dependency
    versionRangeAllowed: false

  vueUse:
    repository: https://github.com/vueuse/vueuse
    tag: v14.4.0
    commit: 24160f9a8f1dcc576f1234008134ed47491c8183
    packages:
      "@vueuse/core": "14.4.0"
      "@vueuse/shared": "14.4.0"
    license: MIT
