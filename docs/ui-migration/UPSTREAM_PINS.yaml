upstreams:
  chatwoot:
    repository: https://github.com/chatwoot/chatwoot
    tag: v4.14.2
    tagObjectSha: a2797a8cf35592de547983d172e6b1556d40c418
    commit: a9468409fb9d5778b847bf93f215140fc357a36b
    license: MIT-Expat-outside-enterprise
    adoption: controlled-source-copy-or-behavior-port
    manifestPath: docs/ui-migration/CHATWOOT_TRANSPLANT_MANIFEST.yaml
    manifestRequiredBeforeAnyCopy: true
    allowedCapability:
      - conversation split-pane presentation
      - conversation list and virtual scrolling behavior
      - message timeline and scroll anchoring behavior
      - message and attachment presentation
      - composer interaction behavior
      - contact-sidebar presentation
      - loading, empty, offline and error states
      - non-business keyboard and accessibility behavior
    deniedSource:
      - enterprise/**
    deniedAuthority:
      - API clients and endpoints
      - Rails or ActionCable integration
      - Vuex, Pinia, router, cache or persistence state
      - account, inbox, workspace, tenant, identity or authentication authority
      - notification policy or desktop notification authority
      - message enqueue, retry, send, delivery reconciliation or platform authority
    copyGate:
      fileLevelProvenanceRequired: true
      exactUpstreamBlobShaRequired: true
      upstreamPathRequired: true
      localPathRequired: true
      localModificationRecordRequired: true
      excludedImportClosureRequired: true
      upstreamTestRecordRequired: true
      yanceAdapterBoundaryRequired: true
      licenseNoticeRequired: true
      archiveSha256RequiredBeforeFirstCopy: true
      noUnresolvedChatwootRuntimeImports: true
      sourceCopyAuthorizedByThisDocument: false

  shadcnVue:
    repository: https://github.com/unovue/shadcn-vue
    tag: v2.7.3
    tagObjectSha: c44d9e99e6902a56675f74bb7b24e6a647b34c1e
    commit: 0840c07ac18bbb2de1d5be8a4bde717595ada013
    license: MIT
    adoption: tracked-local-source
    dependencyAllowed: false
    copyGate:
      fileLevelProvenanceRequired: true
      exactUpstreamBlobShaRequired: true
      upstreamPathRequired: true
      localModificationRecordRequired: true
      licenseNoticeRequired: true
      archiveSha256RequiredBeforeFirstCopy: true
      copiedComponentsBecomeYanceOwnedSource: true
      sourceCopyAuthorizedByThisDocument: false

  rekaUi:
    repository: https://github.com/unovue/reka-ui
    tag: v2.9.7
    tagObjectSha: 1d62f8df74feeeead677159e26fd21e7a4b36bd2
