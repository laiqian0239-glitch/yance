shellRuntime:
  framework: Vue
  frameworkVersion: "3.5.17"
  buildBoundary: apps/yance-desktop-ui
  buildTool: Vite
  buildToolVersion: "6.4.2"
  moduleBoundary: ESM-inside-shell
  hostBoundary: Electron
  packageManager: npm
  exactVersionsOnly: true
