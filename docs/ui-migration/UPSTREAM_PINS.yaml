  howler:
    repository: https://github.com/goldfire/howler.js
    tag: v2.2.4
    commit: 003b917c40cb41cf382ba47ae0ed7a35ca2abe76
    package: howler
    version: "2.2.4"
    license: MIT
    adoption: exact-dependency
