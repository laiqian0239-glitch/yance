name: TEMP observable V21 Electron 43.4.1 amendment-2 root-fix factory v2

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate-root-fixes-v2:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'staging/v21-electron-43.4.1-seed-factory'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact staging execution head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up exact Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Reset exact textual owner paths to frozen predecessor and verify binding inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object package.json)" = "e54002c894cb42ffc93ad94b1341f87b53e60728"
          test "$(git hash-object package-lock.json)" = "d485f45673eeb4a7293a389ffcd28d3ff7c0b56d"
          test "$(git hash-object release/production-dependency-binding.json)" = "b79d186317070f068286ab0131ab397082697f12"
          git checkout b0d9bb68fe1273ffbcc44f9bc6040ddb7a7b5267 -- \
            .github/workflows/v21-product-experience-shell-p0-final-validation.yml \
            governance/architecture-closure-v2/wp-b-xstate-supply-chain-lock.json \
            governance/layered-ci/risk-policy.json \
            tests/layered-ci/governance-policy.test.js \
            tests/layered-ci/v21-product-experience-shell-p0-final-validation.test.js \
            tests/wp0/v21-adaptive-local-llm-runtime-p0.test.js

      - name: Generate exact amendment-2 owner fixes from frozen predecessor bytes
        shell: bash
        run: node .github/tmp-v21-electron-amendment2-root-fix-v2.js

      - name: Require exact six textual owner-path mutations
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v21-product-experience-shell-p0-final-validation.yml' \
            'governance/architecture-closure-v2/wp-b-xstate-supply-chain-lock.json' \
            'governance/layered-ci/risk-policy.json' \
            'tests/layered-ci/governance-policy.test.js' \
            'tests/layered-ci/v21-product-experience-shell-p0-final-validation.test.js' \
            'tests/wp0/v21-adaptive-local-llm-runtime-p0.test.js' | LC_ALL=C sort)"
          if [ "$actual" != "$expected" ]; then
            printf 'EXPECTED:\n%s\nACTUAL:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi

      - name: Run focused causal closure tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/layered-ci/governance-policy.test.js
          node --test tests/layered-ci/v21-product-experience-shell-p0-final-validation.test.js
          node --test backend/tests/architectureClosureV2/wpB/xstateAdoptionCurrentStatus.test.js
          node tools/architecture-closure-v2/verify-wp-b-open-source-adoption.js
          node --test tests/wp0/v21-adaptive-local-llm-runtime-p0.test.js
          node --test tests/wp0/v21-production-dependency-binding-lifecycle.test.js
          node --test tests/wp0/v21-electron-supported-runtime-p0.test.js
          node --test tests/runtime-delivery/electron-archive-tracking-authority.test.js tests/runtime-delivery/source-uat-delivery.test.js

      - name: Commit only verified production owner blobs to staging transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Yance Temporary Amendment-2 Factory'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            .github/workflows/v21-product-experience-shell-p0-final-validation.yml \
            governance/architecture-closure-v2/wp-b-xstate-supply-chain-lock.json \
            governance/layered-ci/risk-policy.json \
            tests/layered-ci/governance-policy.test.js \
            tests/layered-ci/v21-product-experience-shell-p0-final-validation.test.js \
            tests/wp0/v21-adaptive-local-llm-runtime-p0.test.js
          git commit -m '[TEMP] Generate verified frozen-base amendment-2 root-fix blobs'
          git push origin HEAD:refs/heads/staging/v21-electron-43.4.1-seed-factory
