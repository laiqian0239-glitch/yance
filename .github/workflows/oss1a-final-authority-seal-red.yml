name: OSS-1A Final Authority Seal RED

on:
  push:
    branches:
      - generator/oss1a-final-authority-seal-a4f0fdb8
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-prove-red:
    runs-on: ubuntu-24.04
    env:
      IMPLEMENTATION_HEAD: a4f0fdb8b8a66b99e4b0efb56d756b25b197735f
      RED_BRANCH: red/oss1a-final-authority-seal-a4f0fdb8
    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.IMPLEMENTATION_HEAD }}
          fetch-depth: 1
          persist-credentials: true

      - name: Verify exact base
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${IMPLEMENTATION_HEAD}"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate test-only RED commit
        shell: bash
        run: |
          git switch -c "${RED_BRANCH}"
          python3 -c "import base64,zlib; exec(compile(zlib.decompress(base64.b64decode('')), '<oss1a-final-red>', 'exec'))"
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = [
              'backend/tests/messageIdentityEvidenceOrdering.test.js',
              'backend/tests/oss1aWhatsappAuthRepository.test.js',
              'backend/tests/oss1aWhatsappLegacyAuthImport.test.js',
              'backend/tests/oss1aWhatsappRegistrationIdZero.test.js',
              'backend/tests/platformProductionReadinessAuthority.test.js'
          ]
          actual = sorted(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected RED paths: {actual}')
          PY
          git config user.name 'OSS-1A Audit Automation'
          git config user.email 'oss1a-audit@users.noreply.github.com'
          git add -A
          git commit -m 'test(oss1a): expose final auth authority seal RED'
          git push origin "HEAD:refs/heads/${RED_BRANCH}"

      - name: Prove exact RED assertions
        shell: bash
        run: |
          set +e
          node --test --test-concurrency=1 \
            backend/tests/oss1aWhatsappAuthRepository.test.js \
            backend/tests/messageIdentityEvidenceOrdering.test.js \
            backend/tests/platformProductionReadinessAuthority.test.js \
            backend/tests/oss1aWhatsappLegacyAuthImport.test.js \
            2>&1 | tee /tmp/oss1a-final-seal-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "${status}" -ne 0
          grep -F "read-only auth authority projection exposes readiness without decrypting credential material" /tmp/oss1a-final-seal-red.log
          grep -F "WhatsApp runtime authority configuration requires one auth repository capability" /tmp/oss1a-final-seal-red.log
          grep -F "WhatsApp credential readiness reads the configured SQLite auth authority without filesystem fallback" /tmp/oss1a-final-seal-red.log

      - name: Record RED evidence
        shell: bash
        run: |
          {
            echo '### OSS-1A final authority seal RED'
            echo
            echo "- Exact base: \`${IMPLEMENTATION_HEAD}\`"
            echo "- RED branch: \`${RED_BRANCH}\`"
            echo "- RED commit: \`$(git rev-parse HEAD)\`"
            echo '- Product files changed: none'
            echo '- Expected failures: missing metadata-only auth projection and missing shared repository authority injection'
          } >> "${GITHUB_STEP_SUMMARY}"
