name: OSS-1A Final Authority Seal RED

on:
  push:
    branches:
      - generator/oss1a-final-authority-seal-a4f0fdb8
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-prove-red:
    runs-on: ubuntu-24.04
    env:
      IMPLEMENTATION_HEAD: a4f0fdb8b8a66b99e4b0efb56d756b25b197735f
      RED_BRANCH: red/oss1a-final-authority-seal-a4f0fdb8
    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.IMPLEMENTATION_HEAD }}
          fetch-depth: 1
          persist-credentials: true

      - name: Verify exact base
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${IMPLEMENTATION_HEAD}"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate test-only RED commit
        shell: bash
        run: |
          git switch -c "${RED_BRANCH}"
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement anchor, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          repository_test = 'backend/tests/oss1aWhatsappAuthRepository.test.js'
          replace_once(
              repository_test,
              "    'loadAccount',\n    'initializeAccount',",
              "    'loadAccount',\n    'inspectAccount',\n    'initializeAccount',"
          )
          replace_once(
              repository_test,
              "    assert.equal(Object.isFrozen(loaded), true);\n  });\n});\n\ntest('stale generation and socket token fail before encryption and leave ciphertext unchanged', () => {",
              """    assert.equal(Object.isFrozen(loaded), true);
  });
});

test('read-only auth authority projection exposes readiness without decrypting credential material', () => {
  const repositoryModule = loadRepositoryModule();
  withFixture(({ store, cipher }) => {
    let decryptCalls = 0;
    const countingCipher = Object.freeze({
      encrypt: (...args) => cipher.encrypt(...args),
      decrypt(...args) {
        decryptCalls += 1;
        return cipher.decrypt(...args);
      },
      hmacIndex: (...args) => cipher.hmacIndex(...args),
      snapshot: () => cipher.snapshot()
    });
    const repository = createRepository(repositoryModule, { store, cipher: countingCipher });

    const active = repository.inspectAccount(ACCOUNT_KEY);
    assert.deepEqual(active, {
      accountKey: ACCOUNT_KEY,
      accountId: ACCOUNT_ID,
      currentEpoch: EPOCH,
      state: 'ACTIVE',
      registered: true,
      hasIdentity: true,
      credentialMaterialPresent: true,
      usable: true,
      reasonCode: ''
    });
    assert.equal(Object.isFrozen(active), true);
    assert.equal(decryptCalls, 0, 'readiness projection must not decrypt auth material');
    assert.equal(repository.inspectAccount('missing-auth-account'), null);

    repository.markLoggedOut({
      ...writer(),
      nextEpoch: EPOCH + 1,
      loggedOutAt: AT
    });
    const loggedOut = repository.inspectAccount(ACCOUNT_KEY);
    assert.equal(loggedOut.state, 'LOGGED_OUT');
    assert.equal(loggedOut.currentEpoch, EPOCH + 1);
    assert.equal(loggedOut.registered, false);
    assert.equal(loggedOut.hasIdentity, false);
    assert.equal(loggedOut.credentialMaterialPresent, false);
    assert.equal(loggedOut.usable, false);
    assert.equal(loggedOut.reasonCode, 'WHATSAPP_AUTH_LOGGED_OUT');
    assert.equal(decryptCalls, 0, 'terminal readiness projection must remain metadata-only');
  });
});

