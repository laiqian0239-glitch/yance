name: OSS-1A Baileys Lifecycle

on:
  pull_request:
    branches:
      - governance/oss-1a-implementation-authorization
      - governance/oss-1a-runtime-ci-authorization
      - governance/oss-1a-detached-evidence-baseline-v3
      - governance/oss-1a-pre-ready-fd6-authorization
      - governance/oss-1a-event-batch-authorization
      - governance/oss-1a-lifecycle-milestone-authorization
      - governance/oss-1a-async-store-capability-authorization
      - governance/oss-1a-canonical-projection-checkpoint-authorization
  push:
    branches:
      - governance/oss-1a-runtime-ci-authorization
      - governance/oss-1a-detached-evidence-baseline-v3
      - governance/oss-1a-pre-ready-fd6-authorization
      - governance/oss-1a-event-batch-authorization
      - governance/oss-1a-lifecycle-milestone-authorization
      - governance/oss-1a-async-store-capability-authorization
      - governance/oss-1a-canonical-projection-checkpoint-authorization
      - governance/oss1a-reviewed-candidate-registration
      - oss/1a-baileys-lifecycle

permissions:
  contents: read

env:
  REVIEWED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  REVIEWED_CANDIDATE_MANIFEST: governance/open-source-acceleration/oss-1a-reviewed-candidate-task11.json

jobs:
  role:
    name: oss1a-branch-role
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      role: ${{ steps.resolve.outputs.role }}
    steps:
      - name: Checkout trusted merged policy tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          fetch-tags: false
          lfs: false
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Resolve exact manifest-backed workflow role
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          result="$(node tools/oss1a/workflow-branch-role.js \
            "${EVENT_NAME}" "${HEAD_REF}" "${GIT_REF}" "${REVIEWED_HEAD_SHA}" \
            "${REVIEWED_CANDIDATE_MANIFEST}")"
          role="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).role)' "${result}")"
          test "${role}" != "UNKNOWN"
          echo "role=${role}" >> "${GITHUB_OUTPUT}"

  governance-contract:
    name: oss1a-governance-contract
    needs: role
    if: ${{ needs.role.outputs.role == 'GOVERNANCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact reviewed governance head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.REVIEWED_HEAD_SHA }}
          fetch-depth: 0
          fetch-tags: false
          lfs: false
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate exact OSS-1A runtime workflow contract
        run: node --test --test-concurrency=1 tests/wp0/oss1a-runtime-workflow.test.js

  runtime-tests:
    name: oss1a-runtime-tests
    needs: role
    if: ${{ needs.role.outputs.role == 'IMPLEMENTATION' || needs.role.outputs.role == 'REVIEWED_CANDIDATE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact reviewed implementation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.REVIEWED_HEAD_SHA }}
          fetch-depth: 0
          fetch-tags: false
          lfs: false
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run Schema 23 RED GREEN contract
        run: node --test --test-concurrency=1 backend/tests/oss1aWhatsappAuthSchema.test.js

  oss1a-gates:
    name: oss1a-gates
    if: ${{ always() }}
    needs:
      - role
      - governance-contract
      - runtime-tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Enforce exact OSS-1A workflow branch role
        shell: bash
        env:
          ROLE_RESULT: ${{ needs.role.result }}
          ROLE: ${{ needs.role.outputs.role }}
          RUNTIME_RESULT: ${{ needs.runtime-tests.result }}
          GOVERNANCE_RESULT: ${{ needs.governance-contract.result }}
        run: |
          set -euo pipefail
          test "${ROLE_RESULT}" = "success"
          if test "${ROLE}" = "GOVERNANCE"; then
            test "${GOVERNANCE_RESULT}" = "success"
            test "${RUNTIME_RESULT}" = "skipped"
          elif test "${ROLE}" = "IMPLEMENTATION" || test "${ROLE}" = "REVIEWED_CANDIDATE"; then
            test "${GOVERNANCE_RESULT}" = "skipped"
            test "${RUNTIME_RESULT}" = "success"
          else
            echo "unknown OSS-1A workflow branch role" >&2
            exit 1
          fi
