name: WP-B M1 Independent Review Integrity

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/wp-b-m1-independent-review-integrity.yml
      - backend/lib/r32SqliteStore*.js
      - backend/migrations/architectureClosureV2WpB*.js
      - backend/services/durableExecutionAuthority*.js
      - backend/services/externalAction*.js
      - backend/services/externalOutcomeReconciliation.js
      - backend/tests/architectureClosureV2/wpB/m1IndependentReviewIntegrity.test.js
      - backend/tests/architectureClosureV2/wpB/m1ReviewSeal.test.js
      - backend/tests/architectureClosureV2/wpB/m1ReviewWorkflowScope.test.js
      - backend/tests/architectureClosureV2/wpB/externalActionOutbox.test.js
      - backend/tests/architectureClosureV2/wpB/uncertainOutcomeReconciliation.test.js
      - backend/tests/architectureClosureV2/wpB/schema23Migration.test.js
      - backend/tests/architectureClosureV2/wpB/schema23StartupRegistration.test.js
      - governance/architecture-closure-v2/wp-b-m1-review.json
      - shared/release/acv2ActiveWorkPackageAuthority.js
      - tools/architecture-closure-v2/verify-wp-b-m1-review.js
  push:
    branches:
      - acv2/wp-b-durable-execution-outbox
    paths:
      - .github/workflows/wp-b-m1-independent-review-integrity.yml
      - backend/lib/r32SqliteStore*.js
      - backend/migrations/architectureClosureV2WpB*.js
      - backend/services/durableExecutionAuthority*.js
      - backend/services/externalAction*.js
      - backend/services/externalOutcomeReconciliation.js
      - backend/tests/architectureClosureV2/wpB/m1IndependentReviewIntegrity.test.js
      - backend/tests/architectureClosureV2/wpB/m1ReviewSeal.test.js
      - backend/tests/architectureClosureV2/wpB/m1ReviewWorkflowScope.test.js
      - backend/tests/architectureClosureV2/wpB/externalActionOutbox.test.js
      - backend/tests/architectureClosureV2/wpB/uncertainOutcomeReconciliation.test.js
      - backend/tests/architectureClosureV2/wpB/schema23Migration.test.js
      - backend/tests/architectureClosureV2/wpB/schema23StartupRegistration.test.js
      - governance/architecture-closure-v2/wp-b-m1-review.json
      - shared/release/acv2ActiveWorkPackageAuthority.js
      - tools/architecture-closure-v2/verify-wp-b-m1-review.js
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  independent-review-integrity:
    name: wp-b-m1-review-integrity-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout exact review commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.VALIDATION_SHA }}
          fetch-depth: 0
          fetch-tags: false
          lfs: false
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${VALIDATION_SHA}"

      - name: Validate review and seal verifier syntax
        shell: bash
        run: |
          node --check tools/architecture-closure-v2/verify-wp-b-m1-review.js
          node --check backend/tests/architectureClosureV2/wpB/m1IndependentReviewIntegrity.test.js
          node --check backend/tests/architectureClosureV2/wpB/m1ReviewSeal.test.js
          node --check backend/tests/architectureClosureV2/wpB/m1ReviewWorkflowScope.test.js

      - name: Run independent-review integrity contracts
        shell: bash
        run: |
          node --test --test-concurrency=1 \
            backend/tests/architectureClosureV2/wpB/m1IndependentReviewIntegrity.test.js \
            backend/tests/architectureClosureV2/wpB/m1ReviewWorkflowScope.test.js \
            backend/tests/architectureClosureV2/wpB/externalActionOutbox.test.js \
            backend/tests/architectureClosureV2/wpB/uncertainOutcomeReconciliation.test.js

      - name: Run Schema 23 integration regressions
        shell: bash
        run: |
          node --test --test-concurrency=1 \
            backend/tests/architectureClosureV2/wpB/schema23Migration.test.js \
            backend/tests/architectureClosureV2/wpB/schema23StartupRegistration.test.js

      - name: Verify local Milestone 1 review seal
        shell: bash
        run: node --test --test-concurrency=1 backend/tests/architectureClosureV2/wpB/m1ReviewSeal.test.js

      - name: Verify authenticated formal workflow evidence
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/architecture-closure-v2/verify-wp-b-m1-review.js --remote

      - name: Confirm clean validation workspace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
