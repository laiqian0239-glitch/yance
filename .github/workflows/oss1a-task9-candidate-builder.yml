name: OSS-1A Task 9 Candidate Builder

on:
  push:
    branches:
      - work/oss1a-task9-generator

permissions:
  contents: write

jobs:
  build-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact tooling head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 1
          fetch-tags: false
          lfs: false
          persist-credentials: false

      - name: Checkout exact Task 8 implementation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c2b4705bb84ce88abd4a6cf58d53aef6734b15e3
          path: candidate
          fetch-depth: 0
          fetch-tags: false
          lfs: false
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install locked dependencies
        working-directory: candidate
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Task 9 RED contract
        working-directory: candidate
        run: python ../tooling/tools/oss1a/generate_task9_red.py

      - name: Prove RED is the missing socket factory boundary
        working-directory: candidate
        shell: bash
        run: |
          set +e
          node --test --test-concurrency=1 backend/tests/oss1aWhatsappSocketFactory.test.js > task9-red.tap 2>&1
          status=$?
          set -e
          cat task9-red.tap
          test "$status" -ne 0
          grep -F "Cannot find module '../services/whatsappSocketFactory'" task9-red.tap

      - name: Commit isolated Task 9 RED
        working-directory: candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c work/oss1a-task9-red
          git add backend/tests/oss1aWhatsappSocketFactory.test.js
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "1"
          git commit -m 'test(oss1a): require authoritative socket factory'
          git push origin HEAD:refs/heads/work/oss1a-task9-red
