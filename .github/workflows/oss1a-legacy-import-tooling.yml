name: OSS1A Legacy Import Tooling

on:
  push:
    branches:
      - work/oss1a-legacy-import-repository-patch
    paths:
      - .github/workflows/oss1a-legacy-import-tooling.yml

permissions:
  contents: write

jobs:
  publish-orphan-broker-fixture-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Build self-contained orphan Store fixture
        shell: bash
        env:
          IMPLEMENTATION_PARENT: a0248b436bf426147115b4e258517de3427446bc
          CANDIDATE_BRANCH: work/oss1a-orphan-broker-fixture-candidate
        run: |
          set -euo pipefail
          test -z "$(git ls-remote --heads origin "refs/heads/${CANDIDATE_BRANCH}")"
          git show "${IMPLEMENTATION_PARENT}:backend/tests/whatsappOrphanAccountReconciliation.test.js" > /tmp/orphan.test.js
          node <<'NODE'
          const fs = require('node:fs');
          const file = '/tmp/orphan.test.js';
          let source = fs.readFileSync(file, 'utf8');
          function replaceOnce(before, after, label) {
            const first = source.indexOf(before);
            if (first < 0 || source.indexOf(before, first + before.length) >= 0) {
              throw new Error(`${label}: expected one exact match`);
            }
            source = source.slice(0, first) + after + source.slice(first + before.length);
          }
          replaceOnce(
            "const { getStore, closeStore } = require('../repositories/storeProvider');\nconst { stableId } = require('../lib/r32SqliteStore');",
            "const { PATHS } = require('../config');\nconst { acquireAuthorityWriteHost } = require('../services/authorityWriteHost');\nconst {\n  SqliteConnectionBroker,\n  configureSqliteConnectionBroker,\n  resetSqliteConnectionBrokerForTests\n} = require('../lib/sqliteConnectionBroker');\nresetSqliteConnectionBrokerForTests();\nconst testWriteHost = acquireAuthorityWriteHost({\n  dbPath: PATHS.sqlite,\n  instanceId: 'oss1a-orphan-reconciliation-test-host'\n});\nconst testBroker = new SqliteConnectionBroker({\n  dbPath: PATHS.sqlite,\n  authorityWriteHostCapability: testWriteHost.capability\n});\nconfigureSqliteConnectionBroker(testBroker);\ntestBroker.open();\nconst { getStore, closeStore } = require('../repositories/storeProvider');\nconst { stableId } = require('../lib/r32SqliteStore');",
            'broker initialization'
          );
          replaceOnce(
            "process.on('exit', () => {\n  try { closeStore(); } catch (error) { process.stderr.write(`closeStore failed: ${error.message}\\n`); }\n  try { fs.rmSync(dataRoot, { recursive: true, force: true, maxRetries: 10, retryDelay: 50 }); } catch (error) { process.stderr.write(`cleanup failed: ${error.message}\\n`); }\n});",
            "process.on('exit', () => {\n  try { closeStore(); } catch (error) { process.stderr.write(`closeStore failed: ${error.message}\\n`); }\n  try { resetSqliteConnectionBrokerForTests(); } catch (error) { process.stderr.write(`broker reset failed: ${error.message}\\n`); }\n  try { testWriteHost.release(); } catch (error) { process.stderr.write(`write host release failed: ${error.message}\\n`); }\n  try { fs.rmSync(dataRoot, { recursive: true, force: true, maxRetries: 10, retryDelay: 50 }); } catch (error) { process.stderr.write(`cleanup failed: ${error.message}\\n`); }\n});",
            'broker cleanup'
          );
          fs.writeFileSync(file, source, 'utf8');
          NODE
          node --check /tmp/orphan.test.js
          git checkout --detach "${IMPLEMENTATION_PARENT}"
          cp /tmp/orphan.test.js backend/tests/whatsappOrphanAccountReconciliation.test.js
          git add backend/tests/whatsappOrphanAccountReconciliation.test.js
          test "$(git diff --cached --name-only)" = "backend/tests/whatsappOrphanAccountReconciliation.test.js"
          git diff --cached --check
          git config user.name "Yance OSS1A Tooling"
          git config user.email "oss1a-tooling@users.noreply.github.com"
          git commit -m "test(oss1a): self-host orphan reconciliation Store"
          git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
