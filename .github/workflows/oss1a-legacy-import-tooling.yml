name: OSS1A Legacy Import Tooling

on:
  push:
    branches:
      - work/oss1a-legacy-import-repository-patch
    paths:
      - .github/workflows/oss1a-legacy-import-tooling.yml
      - tools/oss1a/generate-legacy-import-repository-patch.js
      - tools/oss1a/legacy-import-repository-method.txt

permissions:
  contents: write

jobs:
  publish-repository-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Build and publish exact repository candidate
        shell: bash
        env:
          IMPLEMENTATION_PARENT: 5710bc88e904993a5172fa515da15798c032a20d
          CANDIDATE_BRANCH: work/oss1a-legacy-import-repository-candidate
        run: |
          set -euo pipefail
          test -z "$(git ls-remote --heads origin "refs/heads/${CANDIDATE_BRANCH}")"
          git show "${IMPLEMENTATION_PARENT}:backend/repositories/whatsappAuthStateRepository.js" > /tmp/whatsappAuthStateRepository.original.js
          node tools/oss1a/generate-legacy-import-repository-patch.js \
            /tmp/whatsappAuthStateRepository.original.js \
            /tmp/whatsappAuthStateRepository.generated.js
          node --check /tmp/whatsappAuthStateRepository.generated.js
          git checkout --detach "${IMPLEMENTATION_PARENT}"
          cp /tmp/whatsappAuthStateRepository.generated.js backend/repositories/whatsappAuthStateRepository.js
          git add backend/repositories/whatsappAuthStateRepository.js
          test "$(git diff --cached --name-only)" = "backend/repositories/whatsappAuthStateRepository.js"
          git diff --cached --check
          git config user.name "Yance OSS1A Tooling"
          git config user.email "oss1a-tooling@users.noreply.github.com"
          git commit -m "feat(oss1a): add two-phase legacy import repository authority"
          git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
