name: OSS1A Legacy Import Tooling

on:
  push:
    branches:
      - work/oss1a-legacy-import-repository-patch
    paths:
      - .github/workflows/oss1a-legacy-import-tooling.yml

permissions:
  contents: write

jobs:
  publish-tombstone-child-diagnostics-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Build exact child-suite diagnostics
        shell: bash
        env:
          IMPLEMENTATION_PARENT: 58913b2616a315962df55d1c1992b0a0dba6ee9a
          CANDIDATE_BRANCH: work/oss1a-legacy-tombstone-child-diagnostics-candidate
        run: |
          set -euo pipefail
          test -z "$(git ls-remote --heads origin "refs/heads/${CANDIDATE_BRANCH}")"
          git show "${IMPLEMENTATION_PARENT}:backend/tests/oss1aWhatsappLegacyAuthImport.test.js" > /tmp/legacy.test.js
          node <<'NODE'
          const fs = require('node:fs');
          const file = '/tmp/legacy.test.js';
          let source = fs.readFileSync(file, 'utf8');
          const before = "  assert.match(result.stdout, /legacy auth discovery stays diagnostic and database tombstone blocks filesystem resurrection/u, result.stdout);\n  assert.match(result.stdout, /# tests 4(?:\\r?\\n|$)/u, result.stdout);\n  assert.equal(result.status, 0, `${result.stdout}\\n${result.stderr}`);";
          const after = "  assert.equal(result.error, undefined, result.error?.stack || String(result.error || ''));\n  assert.notEqual(result.status, null, `${result.stdout}\\n${result.stderr}`);\n  const childOutput = `${result.stdout}\\n${result.stderr}`;\n  assert.match(childOutput, /legacy auth discovery stays diagnostic and database tombstone blocks filesystem resurrection/u, childOutput);\n  assert.match(childOutput, /# tests 4(?:\\r?\\n|$)/u, childOutput);\n  assert.equal(result.status, 0, childOutput);";
          const first = source.indexOf(before);
          if (first < 0 || source.indexOf(before, first + before.length) >= 0) {
            throw new Error('expected one exact child coverage block');
          }
          source = source.slice(0, first) + after + source.slice(first + before.length);
          fs.writeFileSync(file, source, 'utf8');
          NODE
          node --check /tmp/legacy.test.js
          git checkout --detach "${IMPLEMENTATION_PARENT}"
          cp /tmp/legacy.test.js backend/tests/oss1aWhatsappLegacyAuthImport.test.js
          git add backend/tests/oss1aWhatsappLegacyAuthImport.test.js
          test "$(git diff --cached --name-only)" = "backend/tests/oss1aWhatsappLegacyAuthImport.test.js"
          git diff --cached --check
          git config user.name "Yance OSS1A Tooling"
          git config user.email "oss1a-tooling@users.noreply.github.com"
          git commit -m "test(oss1a): expose orphan tombstone child failures"
          git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
