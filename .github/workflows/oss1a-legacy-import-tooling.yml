name: OSS1A Legacy Import Tooling

on:
  push:
    branches:
      - work/oss1a-legacy-import-repository-patch
    paths:
      - .github/workflows/oss1a-legacy-import-tooling.yml

permissions:
  contents: write

jobs:
  publish-tombstone-child-isolation-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Build exact child node:test isolation fix
        shell: bash
        env:
          IMPLEMENTATION_PARENT: 66063b78357c80d331cd59a6532562abd1602005
          CANDIDATE_BRANCH: work/oss1a-legacy-tombstone-child-isolation-candidate
        run: |
          set -euo pipefail
          test -z "$(git ls-remote --heads origin "refs/heads/${CANDIDATE_BRANCH}")"
          git show "${IMPLEMENTATION_PARENT}:backend/tests/oss1aWhatsappLegacyAuthImport.test.js" > /tmp/legacy.test.js
          node <<'NODE'
          const fs = require('node:fs');
          const file = '/tmp/legacy.test.js';
          let source = fs.readFileSync(file, 'utf8');
          const before = "  const result = childProcess.spawnSync(process.execPath, ['--test', '--test-concurrency=1', suite], {\n    encoding: 'utf8',\n    maxBuffer: 16 * 1024 * 1024,\n    env: { ...process.env, YANCE_TEST_ONLY_SQLITE_BROKER_RESET: '1' }\n  });";
          const after = "  const childEnv = { ...process.env, YANCE_TEST_ONLY_SQLITE_BROKER_RESET: '1' };\n  delete childEnv.NODE_TEST_CONTEXT;\n  const result = childProcess.spawnSync(process.execPath, ['--test', '--test-concurrency=1', suite], {\n    encoding: 'utf8',\n    maxBuffer: 16 * 1024 * 1024,\n    env: childEnv\n  });";
          const first = source.indexOf(before);
          if (first < 0 || source.indexOf(before, first + before.length) >= 0) {
            throw new Error('expected one exact recursive node:test child block');
          }
          source = source.slice(0, first) + after + source.slice(first + before.length);
          fs.writeFileSync(file, source, 'utf8');
          NODE
          node --check /tmp/legacy.test.js
          git checkout --detach "${IMPLEMENTATION_PARENT}"
          cp /tmp/legacy.test.js backend/tests/oss1aWhatsappLegacyAuthImport.test.js
          git add backend/tests/oss1aWhatsappLegacyAuthImport.test.js
          test "$(git diff --cached --name-only)" = "backend/tests/oss1aWhatsappLegacyAuthImport.test.js"
          git diff --cached --check
          git config user.name "Yance OSS1A Tooling"
          git config user.email "oss1a-tooling@users.noreply.github.com"
          git commit -m "test(oss1a): isolate nested node test context"
          git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
