name: OSS1A Legacy Import Tooling

on:
  push:
    branches:
      - work/oss1a-legacy-import-repository-patch
    paths:
      - .github/workflows/oss1a-legacy-import-tooling.yml

permissions:
  contents: write

jobs:
  publish-purpose-fix-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Build and publish exact importer purpose fix
        shell: bash
        env:
          IMPLEMENTATION_PARENT: 963452d8e898db4abd5ff54f7d53e77ead6202dd
          CANDIDATE_BRANCH: work/oss1a-legacy-import-purpose-candidate
        run: |
          set -euo pipefail
          test -z "$(git ls-remote --heads origin "refs/heads/${CANDIDATE_BRANCH}")"
          git show "${IMPLEMENTATION_PARENT}:backend/services/whatsappLegacyAuthImporter.js" > /tmp/importer.js
          node <<'NODE'
          const fs = require('node:fs');
          const file = '/tmp/importer.js';
          let source = fs.readFileSync(file, 'utf8');
          function replaceOnce(before, after, label) {
            const first = source.indexOf(before);
            if (first < 0 || source.indexOf(before, first + before.length) >= 0) {
              throw new Error(`${label}: expected one exact match`);
            }
            source = source.slice(0, first) + after + source.slice(first + before.length);
          }
          replaceOnce("'LEGACY_AUTH_SOURCE_DIRECTORY'", "'SOURCE_DIRECTORY'", 'source purpose');
          replaceOnce("'LEGACY_AUTH_CLEANUP_REFERENCE'", "'CLEANUP_REFERENCE'", 'cleanup purpose');
          fs.writeFileSync(file, source, 'utf8');
          NODE
          node --check /tmp/importer.js
          git checkout --detach "${IMPLEMENTATION_PARENT}"
          cp /tmp/importer.js backend/services/whatsappLegacyAuthImporter.js
          git add backend/services/whatsappLegacyAuthImporter.js
          test "$(git diff --cached --name-only)" = "backend/services/whatsappLegacyAuthImporter.js"
          git diff --cached --check
          git config user.name "Yance OSS1A Tooling"
          git config user.email "oss1a-tooling@users.noreply.github.com"
          git commit -m "fix(oss1a): use frozen legacy import HMAC domains"
          git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
