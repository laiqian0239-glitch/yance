name: OSS1A Legacy Import Tooling

on:
  push:
    branches:
      - work/oss1a-legacy-import-repository-patch
    paths:
      - .github/workflows/oss1a-legacy-import-tooling.yml
      - tools/oss1a/generate-tombstone-red.js
      - tools/oss1a/tombstone-orphan-test-fragment.txt
      - tools/oss1a/tombstone-gate-fragment.txt

permissions:
  contents: write

jobs:
  publish-tombstone-red-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Build isolated resolver and recovery RED
        shell: bash
        env:
          IMPLEMENTATION_PARENT: 3c57d8c95809a6782786a2f0892b9f58a3c24114
          CANDIDATE_BRANCH: work/oss1a-legacy-tombstone-red-candidate
        run: |
          set -euo pipefail
          test -z "$(git ls-remote --heads origin "refs/heads/${CANDIDATE_BRANCH}")"
          git show "${IMPLEMENTATION_PARENT}:backend/tests/whatsappOrphanAccountReconciliation.test.js" > /tmp/orphan.input.js
          git show "${IMPLEMENTATION_PARENT}:backend/tests/oss1aWhatsappLegacyAuthImport.test.js" > /tmp/legacy.input.js
          node tools/oss1a/generate-tombstone-red.js \
            /tmp/orphan.input.js \
            /tmp/legacy.input.js \
            /tmp/orphan.output.js \
            /tmp/legacy.output.js
          git checkout --detach "${IMPLEMENTATION_PARENT}"
          cp /tmp/orphan.output.js backend/tests/whatsappOrphanAccountReconciliation.test.js
          cp /tmp/legacy.output.js backend/tests/oss1aWhatsappLegacyAuthImport.test.js
          git add backend/tests/whatsappOrphanAccountReconciliation.test.js backend/tests/oss1aWhatsappLegacyAuthImport.test.js
          test "$(git diff --cached --name-only | wc -l)" = "2"
          git diff --cached --check
          git config user.name "Yance OSS1A Tooling"
          git config user.email "oss1a-tooling@users.noreply.github.com"
          git commit -m "test(oss1a): forbid legacy resurrection during recovery"
          git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
