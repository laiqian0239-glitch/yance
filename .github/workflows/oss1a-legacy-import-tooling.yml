name: OSS1A Legacy Import Tooling

on:
  push:
    branches:
      - work/oss1a-legacy-import-repository-patch
    paths:
      - .github/workflows/oss1a-legacy-import-tooling.yml

permissions:
  contents: write

jobs:
  publish-account-snapshot-test-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Align tombstone snapshot with canonical account columns
        shell: bash
        env:
          IMPLEMENTATION_PARENT: 5120347ee57f6ae9808616c8693ca6dfb8b45ada
          CANDIDATE_BRANCH: work/oss1a-tombstone-account-snapshot-candidate
        run: |
          set -euo pipefail
          test -z "$(git ls-remote --heads origin "refs/heads/${CANDIDATE_BRANCH}")"
          git show "${IMPLEMENTATION_PARENT}:backend/tests/whatsappOrphanAccountReconciliation.test.js" > /tmp/orphan.test.js
          node <<'NODE'
          const fs = require('node:fs');
          const file = '/tmp/orphan.test.js';
          let source = fs.readFileSync(file, 'utf8');
          const before = "SELECT state,lifecycle_state,tombstoned_at,auto_reconnect,paused FROM r32_accounts WHERE id=?";
          const after = "SELECT state,can_send,can_receive,payload_json,updated_at FROM r32_accounts WHERE id=?";
          const matches = source.split(before).length - 1;
          if (matches !== 2) throw new Error(`expected two canonical account snapshot queries, found ${matches}`);
          source = source.split(before).join(after);
          fs.writeFileSync(file, source, 'utf8');
          NODE
          node --check /tmp/orphan.test.js
          git checkout --detach "${IMPLEMENTATION_PARENT}"
          cp /tmp/orphan.test.js backend/tests/whatsappOrphanAccountReconciliation.test.js
          git add backend/tests/whatsappOrphanAccountReconciliation.test.js
          test "$(git diff --cached --name-only)" = "backend/tests/whatsappOrphanAccountReconciliation.test.js"
          git diff --cached --check
          git config user.name "Yance OSS1A Tooling"
          git config user.email "oss1a-tooling@users.noreply.github.com"
          git commit -m "test(oss1a): snapshot canonical account tombstone columns"
          git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
