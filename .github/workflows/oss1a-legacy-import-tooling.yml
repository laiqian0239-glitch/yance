name: OSS1A Legacy Import Tooling

on:
  push:
    branches:
      - work/oss1a-legacy-import-repository-patch
    paths:
      - .github/workflows/oss1a-legacy-import-tooling.yml

permissions:
  contents: write

jobs:
  publish-prepare-sql-fix-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Build and publish exact PREPARE SQL fix
        shell: bash
        env:
          IMPLEMENTATION_PARENT: 9a016017aac40424fe851231c9f6d136eb3514a3
          CANDIDATE_BRANCH: work/oss1a-legacy-import-prepare-sql-candidate
        run: |
          set -euo pipefail
          test -z "$(git ls-remote --heads origin "refs/heads/${CANDIDATE_BRANCH}")"
          git show "${IMPLEMENTATION_PARENT}:backend/repositories/whatsappAuthStateRepository.js" > /tmp/repository.js
          node <<'NODE'
          const fs = require('node:fs');
          const file = '/tmp/repository.js';
          let source = fs.readFileSync(file, 'utf8');
          const before = ") VALUES(?,?,?,?,NULL,NULL,NULL,NULL,NULL,'',0,'',?,?,?,?,?,'','')`).run(";
          const after = ") VALUES(?,?,?,?,NULL,NULL,NULL,NULL,NULL,'',0,'',?,?,?,?,'','')`).run(";
          const first = source.indexOf(before);
          if (first < 0 || source.indexOf(before, first + before.length) >= 0) {
            throw new Error('expected one exact PREPARE account INSERT shape');
          }
          source = source.slice(0, first) + after + source.slice(first + before.length);
          fs.writeFileSync(file, source, 'utf8');
          NODE
          node --check /tmp/repository.js
          git checkout --detach "${IMPLEMENTATION_PARENT}"
          cp /tmp/repository.js backend/repositories/whatsappAuthStateRepository.js
          git add backend/repositories/whatsappAuthStateRepository.js
          test "$(git diff --cached --name-only)" = "backend/repositories/whatsappAuthStateRepository.js"
          git diff --cached --check
          git config user.name "Yance OSS1A Tooling"
          git config user.email "oss1a-tooling@users.noreply.github.com"
          git commit -m "fix(oss1a): align legacy PREPARE account insert shape"
          git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
