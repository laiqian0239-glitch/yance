name: OSS1A Task5 Adapter Tooling

on:
  push:
    branches:
      - work/oss1a-task5-adapter-patch
    paths:
      - .github/workflows/oss1a-task5-adapter-tooling.yml

permissions:
  contents: write

jobs:
  publish-adapter-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Build and publish exact adapter write-fence patch
        shell: bash
        env:
          IMPLEMENTATION_PARENT: 2de6462832809f8d243d9e0681693f9de87b2a8b
          CANDIDATE_BRANCH: work/oss1a-task5-adapter-candidate
        run: |
          set -euo pipefail
          test -z "$(git ls-remote --heads origin "refs/heads/${CANDIDATE_BRANCH}")"
          git show "${IMPLEMENTATION_PARENT}:backend/services/whatsappAdapter.js" > /tmp/whatsappAdapter.js
          node <<'NODE'
          const fs = require('node:fs');
          const file = '/tmp/whatsappAdapter.js';
          let source = fs.readFileSync(file, 'utf8');
          function replaceOnce(before, after, label) {
            const first = source.indexOf(before);
            if (first < 0 || source.indexOf(before, first + before.length) >= 0) {
              throw new Error(`${label}: expected one exact match`);
            }
            source = source.slice(0, first) + after + source.slice(first + before.length);
          }
          replaceOnce(
`    row.sessionFence = createSessionGenerationFence(
      () => this.accounts.get(accountId) === row && this.generations.get(accountId) === row.generation,
      { prefix: \`whatsapp:${databaseAccountId}\` }
    );`,
`    row.sessionFence = createSessionGenerationFence(
      () => this.accounts.get(accountId) === row && this.generations.get(accountId) === row.generation,
      {
        prefix: \`whatsapp:${databaseAccountId}\`,
        generation: row.generation,
        epoch: Number.isInteger(options.authEpoch) ? options.authEpoch : 0,
        socketToken: typeof options.socketToken === 'string' ? options.socketToken : ''
      }
    );`,
            'session fence authority details'
          );
          replaceOnce(
`    onSocket('creds.update', async update => {
      await saveCreds(update);
      socketGuard.assertCurrent({ accountId: databaseAccountId, eventName: 'creds.update' });
      this.invalidateCredentialState(reference);
    });`,
`    onSocket('creds.update', async update => {
      const writeResult = await socketGuard.runWrite(
        { accountId: databaseAccountId, eventName: 'creds.update' },
        () => saveCreds(update)
      );
      if (!writeResult.ok) return writeResult;
      this.invalidateCredentialState(reference);
      return writeResult;
    });`,
            'creds update write fence'
          );
          fs.writeFileSync(file, source, 'utf8');
          NODE
          node --check /tmp/whatsappAdapter.js
          git checkout --detach "${IMPLEMENTATION_PARENT}"
          cp /tmp/whatsappAdapter.js backend/services/whatsappAdapter.js
          git add backend/services/whatsappAdapter.js
          test "$(git diff --cached --name-only)" = "backend/services/whatsappAdapter.js"
          git diff --cached --check
          git config user.name "Yance OSS1A Tooling"
          git config user.email "oss1a-tooling@users.noreply.github.com"
          git commit -m "fix(oss1a): fence credential writes before save"
          git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
