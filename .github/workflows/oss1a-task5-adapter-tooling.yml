name: OSS1A Task5 Adapter Tooling

on:
  push:
    branches:
      - work/oss1a-task5-adapter-patch
    paths:
      - .github/workflows/oss1a-task5-adapter-tooling.yml
      - tools/oss1a/generate-task5-adapter-patch.js

permissions:
  contents: write

jobs:
  publish-adapter-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Build and publish exact adapter write-fence patch
        shell: bash
        env:
          IMPLEMENTATION_PARENT: 2de6462832809f8d243d9e0681693f9de87b2a8b
          CANDIDATE_BRANCH: work/oss1a-task5-adapter-candidate
        run: |
          set -euo pipefail
          test -z "$(git ls-remote --heads origin "refs/heads/${CANDIDATE_BRANCH}")"
          git show "${IMPLEMENTATION_PARENT}:backend/services/whatsappAdapter.js" > /tmp/whatsappAdapter.input.js
          node tools/oss1a/generate-task5-adapter-patch.js \
            /tmp/whatsappAdapter.input.js \
            /tmp/whatsappAdapter.output.js
          node --check /tmp/whatsappAdapter.output.js
          git checkout --detach "${IMPLEMENTATION_PARENT}"
          cp /tmp/whatsappAdapter.output.js backend/services/whatsappAdapter.js
          git add backend/services/whatsappAdapter.js
          test "$(git diff --cached --name-only)" = "backend/services/whatsappAdapter.js"
          git diff --cached --check
          git config user.name "Yance OSS1A Tooling"
          git config user.email "oss1a-tooling@users.noreply.github.com"
          git commit -m "fix(oss1a): fence credential writes before save"
          git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
