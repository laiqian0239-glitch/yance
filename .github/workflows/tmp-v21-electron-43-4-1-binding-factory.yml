name: TEMP observable V21 Electron 43.4.1 production binding factory

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate-binding:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'staging/v21-electron-43.4.1-seed-factory'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact staging execution head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up exact Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Bind exact npm and verify source package identities
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.2 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = "v22.23.1"
          test "$(npm --version)" = "10.9.2"
          test "$(git hash-object package.json)" = "e54002c894cb42ffc93ad94b1341f87b53e60728"
          test "$(git hash-object package-lock.json)" = "d485f45673eeb4a7293a389ffcd28d3ff7c0b56d"

      - name: Generate canonical Linux and Windows production dependency binding
        shell: bash
        run: |
          set -euo pipefail
          node tools/wp7/generate-production-dependency-binding.js
          node --test tests/wp0/v21-production-dependency-binding-lifecycle.test.js

      - name: Commit only canonical binding output to staging transport
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          unexpected="$(git status --porcelain=v1 --untracked-files=all | awk '{print $2}' | grep -v '^release/production-dependency-binding.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generator side effects:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if git diff --quiet -- release/production-dependency-binding.json; then
            echo 'Canonical binding already current.'
            exit 0
          fi
          git config user.name 'Yance Temporary Binding Factory'
          git config user.email 'actions@users.noreply.github.com'
          git add -- release/production-dependency-binding.json
          git commit -m '[TEMP] Generate canonical Electron 43.4.1 production dependency binding'
          git push origin HEAD:refs/heads/staging/v21-electron-43.4.1-seed-factory
