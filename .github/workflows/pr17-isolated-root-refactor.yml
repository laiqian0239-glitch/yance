name: PR17 Isolated Root Refactor

on:
  push:
    branches:
      - work/pr17-sqlite-wp0-root-fix

permissions:
  contents: write

concurrency:
  group: pr17-isolated-root-refactor
  cancel-in-progress: false

jobs:
  refactor-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/pr17-sqlite-wp0-root-fix
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply bottom-level refactor
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/refactor-pr17-sqlite-authority.js
          node .github/scripts/refactor-pr17-sqlite-authority.js
          node --check .github/scripts/patch-pr17-refactor-contract.js
          node .github/scripts/patch-pr17-refactor-contract.js
          node --check backend/lib/r32SqliteStoreEngineLegacy.js
          node --check backend/lib/r32SqliteStoreEngine.js
          node --check backend/lib/r32SqliteStore.js

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run branch-independent authority regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 backend/tests/architectureClosureV2/wpB/sqliteStoreSingleAuthority.test.js
          node --test --test-concurrency=1 backend/tests/architectureClosureV2/wpA/sourceClosureInventory.test.js
          node --test --test-concurrency=1 tests/wp0/acv2-work-package-scope-wiring.test.js
          node --test --test-concurrency=1 backend/tests/architectureClosureV2/wpB/schema23Migration.test.js
          node --test --test-concurrency=1 backend/tests/architectureClosureV2/wpB/schema23SqliteIntegration.test.js

      - name: Commit verified refactor and remove executor
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/refactor-pr17-sqlite-authority.js
          rm -f .github/scripts/patch-pr17-refactor-contract.js
          rm -f .github/workflows/pr17-isolated-root-refactor.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain=v1)"
          git commit -m "refactor(wp-b): make SQLite startup authority physically singular"
          git push origin HEAD:work/pr17-sqlite-wp0-root-fix
