name: OSS-1A WhatsApp Lifecycle Fault Matrix

on:
  pull_request:
    branches:
      - governance/oss-1a-async-store-capability-authorization
  push:
    branches:
      - oss/1a-baileys-lifecycle

permissions:
  contents: read

env:
  REVIEWED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  task10-fault-matrix:
    name: task10-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact reviewed implementation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.REVIEWED_HEAD_SHA }}
          fetch-depth: 0
          fetch-tags: false
          lfs: false
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run Task 10 matrix contracts
        run: >-
          node --test --test-concurrency=1
          tests/oss1a/whatsapp-auth-crash-matrix.test.js
          tests/oss1a/whatsapp-generation-concurrency-matrix.test.js
      - name: Run real auth crash matrix
        run: node tools/oss1a/whatsapp-auth-crash-matrix.js
      - name: Run real generation concurrency matrix
        run: node tools/oss1a/whatsapp-generation-concurrency-matrix.js

  task10-gate:
    name: task10-gate
    if: ${{ always() }}
    needs:
      - task10-fault-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Enforce both platform matrices
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.task10-fault-matrix.result }}
        run: |
          set -euo pipefail
          test "${MATRIX_RESULT}" = "success"
