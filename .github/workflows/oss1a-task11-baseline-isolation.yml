name: OSS-1A Task 11 Baseline Isolation

on:
  push:
    branches:
      - codex/oss1a-task11-generator-c0cf81de

permissions:
  contents: read
  statuses: write

concurrency:
  group: oss1a-task11-baseline-isolation-c0cf81de
  cancel-in-progress: false

jobs:
  isolate-baseline-red:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_SHA: c0cf81de7a0350f2faa1af8877ec4ea16d01e496
    steps:
      - name: Checkout diagnostic orchestration
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up sealed Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install exact baseline dependencies once
        shell: bash
        run: |
          set -euo pipefail
          dependency_root="${RUNNER_TEMP}/task11-baseline-dependencies"
          git worktree add --detach "$dependency_root" "$BASE_SHA"
          test "$(git -C "$dependency_root" rev-parse HEAD)" = "$BASE_SHA"
          (
            cd "$dependency_root"
            npm ci
          )
          {
            echo "DEPENDENCY_ROOT=$dependency_root"
            echo "DIAGNOSTIC_ROOT=${RUNNER_TEMP}/task11-baseline-diagnostic"
            echo "DIAGNOSTIC_LOGS=${RUNNER_TEMP}/task11-baseline-logs"
          } >> "$GITHUB_ENV"

      - name: Isolate every OSS-1A test file from exact baseline
        id: isolate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$DIAGNOSTIC_LOGS"
          mapfile -t files < <(
            git -C "$DEPENDENCY_ROOT" ls-tree -r --name-only "$BASE_SHA" \
              | grep -E '^(backend/tests/oss1a[^/]*\.test\.js|tests/oss1a/[^/]+\.test\.js)$' \
              | sort
          )
          test "${#files[@]}" -gt 0
          printf '%s\n' "${files[@]}" > "$DIAGNOSTIC_LOGS/test-files.txt"

          repository_api="/repos/${GITHUB_REPOSITORY}"
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          failed_files=()

          summarize_log() {
            local log_file="$1"
            local summary
            summary="$(
              grep -E -m1 'SQLITE|not ok|AssertionError|ERR_[A-Z_]+|Error:' "$log_file" \
                | tr '\n' ' ' \
                | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//' \
                | cut -c1-105 \
                || true
            )"
            printf '%s' "${summary:-test failed without a matched diagnostic line}"
          }

          publish_failure() {
            local file="$1"
            local log_file="$2"
            local ordinal="$3"
            local basename context description
            basename="$(basename "$file" .test.js)"
            context="oss1a/task11/baseline-file/${ordinal}-${basename}"
            context="${context:0:100}"
            description="$(summarize_log "$log_file")"
            gh api --method POST "${repository_api}/statuses/${GITHUB_SHA}" \
              -f state=failure \
              -f context="$context" \
              -f description="${file}: ${description}" \
              -f target_url="$target_url" >/dev/null
          }

          run_isolated() {
            local file="$1"
            local ordinal="$2"
            local worktree="${DIAGNOSTIC_ROOT}-${ordinal}"
            local log_file="${DIAGNOSTIC_LOGS}/${ordinal}-$(basename "$file").log"
            rm -rf "$worktree"
            git worktree add --detach "$worktree" "$BASE_SHA" >/dev/null
            test "$(git -C "$worktree" rev-parse HEAD)" = "$BASE_SHA"
            ln -s "$DEPENDENCY_ROOT/node_modules" "$worktree/node_modules"
            if (
              cd "$worktree"
              node --test --test-concurrency=1 "$file"
            ) >"$log_file" 2>&1; then
              printf 'GREEN\t%s\n' "$file" | tee -a "$DIAGNOSTIC_LOGS/results.tsv"
              result=0
            else
              printf 'RED\t%s\n' "$file" | tee -a "$DIAGNOSTIC_LOGS/results.tsv"
              result=1
            fi
            rm -f "$worktree/node_modules"
            git worktree remove --force "$worktree"
            return "$result"
          }

          ordinal=0
          for file in "${files[@]}"; do
            ordinal=$((ordinal + 1))
            label="$(printf '%03d' "$ordinal")"
            if ! run_isolated "$file" "$label"; then
              failed_files+=("$file")
              publish_failure "$file" \
                "$DIAGNOSTIC_LOGS/${label}-$(basename "$file").log" \
                "$label"
            fi
          done

          if [[ "${#failed_files[@]}" -gt 0 ]]; then
            printf '%s\n' "${failed_files[@]}" > "$DIAGNOSTIC_LOGS/failing-files.txt"
            diagnostic="${#failed_files[@]} exact-baseline test file(s) fail alone"
            echo "classification=single-file" >> "$GITHUB_OUTPUT"
          else
            diagnostic="all files pass alone; aggregate/order pollution confirmed"
            echo "classification=aggregate-order" >> "$GITHUB_OUTPUT"

            low=2
            high="${#files[@]}"
            first_bad=0
            while [[ "$low" -le "$high" ]]; do
              mid=$(((low + high) / 2))
              worktree="${DIAGNOSTIC_ROOT}-prefix-${mid}"
              log_file="${DIAGNOSTIC_LOGS}/prefix-${mid}.log"
              rm -rf "$worktree"
              git worktree add --detach "$worktree" "$BASE_SHA" >/dev/null
              ln -s "$DEPENDENCY_ROOT/node_modules" "$worktree/node_modules"
              if (
                cd "$worktree"
                node --test --test-concurrency=1 "${files[@]:0:mid}"
              ) >"$log_file" 2>&1; then
                low=$((mid + 1))
              else
                first_bad="$mid"
                high=$((mid - 1))
              fi
              rm -f "$worktree/node_modules"
              git worktree remove --force "$worktree"
            done

            if [[ "$first_bad" -gt 0 ]]; then
              trigger="${files[$((first_bad - 1))]}"
              printf '%s\n' "$trigger" > "$DIAGNOSTIC_LOGS/first-failing-prefix-trigger.txt"
              publish_failure "$trigger" \
                "$DIAGNOSTIC_LOGS/prefix-${first_bad}.log" \
                "prefix-${first_bad}"
              diagnostic="aggregate first fails at prefix ${first_bad}: ${trigger}"
            else
              diagnostic="individual files pass and no failing prefix was reproduced"
            fi
          fi

          gh api --method POST "${repository_api}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context="oss1a/task11/baseline-diagnostic" \
            -f description="${diagnostic:0:140}" \
            -f target_url="$target_url" >/dev/null

          {
            echo "### Task 11 exact-baseline isolation"
            echo
            echo "- Base: \`$BASE_SHA\`"
            echo "- Test files: \`${#files[@]}\`"
            echo "- Result: $diagnostic"
            echo "- Candidate and implementation branches were not modified."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete baseline isolation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task11-baseline-isolation-${{ github.sha }}
          path: ${{ runner.temp }}/task11-baseline-logs
          if-no-files-found: error
          retention-days: 14
