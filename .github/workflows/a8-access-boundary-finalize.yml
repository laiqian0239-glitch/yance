name: A8 Isolated Access Boundary Finalize

on:
  push:
    branches:
      - acv2/wp-a-a8-batch-root-fix
    paths:
      - tools/architecture-closure-v2/a8-access-boundary-batch.js
      - tools/architecture-closure-v2/a8-migration-snapshot-root-batch.js
      - .github/workflows/a8-access-boundary-finalize.yml

concurrency:
  group: a8-isolated-access-boundary-finalize
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: acv2/wp-a-a8-batch-root-fix
          fetch-depth: 0
          fetch-tags: false
          lfs: false
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Apply root refactors
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node tools/architecture-closure-v2/a8-access-boundary-batch.js 2>&1 | tee /tmp/01-patch.log
          node tools/architecture-closure-v2/a8-migration-snapshot-root-batch.js 2>&1 | tee /tmp/02-snapshot-root.log

      - name: Check changed source syntax
        id: syntax
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          for file in \
            backend/lib/sqliteOwnership.js \
            backend/store/contactIdentityConfirmationRepository.js \
            backend/store/adapters/SqliteStorePersistenceAdapter.js \
            backend/server.js \
            backend/services/workspaceIdentityCommandFacade.js \
            backend/routes/workspace.js \
            backend/runtime/AppRuntimeComposition.js \
            backend/migrations/migrationSnapshotRoot.js \
            backend/migrations/stage6_3_4ArchitectureClosure.js \
            backend/migrations/round12PlatformCoreUnification.js \
            backend/migrations/round12Round13SelfCheckHardening.js; do
            node --check "$file"
          done 2>&1 | tee /tmp/03-syntax.log

      - name: Verify explicit capabilities and snapshot-root authority
        id: capability
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          NODE_TEST_CONTEXT=a8-access-boundary node - <<'NODE' 2>&1 | tee /tmp/04-capability.log
          const assert = require('node:assert/strict');
          const path = require('node:path');
          const { SqliteStorePersistenceAdapter } = require('./backend/store/adapters/SqliteStorePersistenceAdapter');
          const { resolveMigrationSnapshotRoot } = require('./backend/migrations/migrationSnapshotRoot');
          assert.throws(() => new SqliteStorePersistenceAdapter(), error => error?.code === 'PRIMARY_STORE_CAPABILITY_REQUIRED');
          const store = { db: {}, transactionAsync() {} };
          assert.equal(new SqliteStorePersistenceAdapter({ store }).store, store);
          assert.equal(resolveMigrationSnapshotRoot('/tmp/yance.db'), path.join('/tmp', 'migration-backups'));
          assert.equal(resolveMigrationSnapshotRoot('/tmp/yance-data/store/yance.db'), path.join('/tmp/yance-data', 'migration-backups'));
          assert.throws(() => resolveMigrationSnapshotRoot('/yance.db'), error => error?.code === 'MIGRATION_SNAPSHOT_ROOT_UNSAFE');
          NODE

      - name: Verify exact remaining inventory
        id: inventory
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node --test --test-concurrency=1 backend/tests/architectureClosureV2/wpA/sourceClosureInventory.test.js > /tmp/05-inventory-test.log 2>&1
          test_status=$?
          node - <<'NODE' > /tmp/06-inventory-report.json 2>/tmp/06-inventory-assert.log
          const assert = require('node:assert/strict');
          const { scanRegisteredSources } = require('./tools/architecture-closure-v2/source-closure-scan');
          const report = scanRegisteredSources({ wp: 'A' });
          process.stdout.write(`${JSON.stringify({ violationCount: report.violationCount, counts: report.counts, violations: report.violations }, null, 2)}\n`);
          assert.equal(report.violationCount, 7);
          assert.deepEqual(report.counts, {
            PRIMARY_DB_ROLE_BOUNDARY_INCOMPLETE: 4,
            CANONICAL_LEDGER_COORDINATOR_MISSING: 3
          });
          NODE
          report_status=$?
          cat /tmp/05-inventory-test.log
          cat /tmp/06-inventory-report.json
          cat /tmp/06-inventory-assert.log
          if [ "$test_status" -ne 0 ] || [ "$report_status" -ne 0 ]; then exit 1; fi

      - name: Verify A6 runtime graph
        id: a6
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=1 \
            backend/tests/architectureClosureV2/wpA/runtimeComposition.test.js \
            backend/tests/architectureClosureV2/wpA/runtimeGatewaySurface.test.js \
            backend/tests/architectureClosureV2/wpA/runtimeStateStoreBinding.test.js \
            backend/tests/architectureClosureV2/wpA/runtimeProcessSingleton.test.js \
            backend/tests/architectureClosureV2/wpA/startupOrdering.test.js \
            2>&1 | tee /tmp/07-a6.log

      - name: Verify identity and migration regressions
        id: regression
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          NODE_TEST_CONTEXT=a8-access-boundary node --test --test-concurrency=1 \
            backend/tests/contactIdentityConfirmation.test.js \
            backend/tests/p0bIntegration.test.js \
            backend/tests/batch40MigrationSnapshotManifest.test.js \
            2>&1 | tee /tmp/08-regression.log

      - name: Verify diff integrity
        id: integrity
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            git diff --check
            git status --short --untracked-files=all
          } 2>&1 | tee /tmp/09-integrity.log

      - name: Commit source-only success or fail-closed diagnostics
        if: always()
        shell: bash
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          CAPABILITY_OUTCOME: ${{ steps.capability.outcome }}
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          A6_OUTCOME: ${{ steps.a6.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.integrity.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          outcomes="$PATCH_OUTCOME $SYNTAX_OUTCOME $CAPABILITY_OUTCOME $INVENTORY_OUTCOME $A6_OUTCOME $REGRESSION_OUTCOME $INTEGRITY_OUTCOME"
          if [[ "$outcomes" == "success success success success success success success" ]]; then
            rm -f \
              tools/architecture-closure-v2/a8-access-boundary-batch.js \
              tools/architecture-closure-v2/a8-migration-snapshot-root-batch.js \
              .github/workflows/a8-access-boundary-finalize.yml
            rm -rf diagnostics/a8/access-boundary
            git add -A
            git diff --cached --check
            git commit -m "refactor(a8): bind primary access to explicit authorities"
          else
            mkdir -p /tmp/final-diagnostics
            for file in /tmp/0*.log /tmp/0*.json; do [ -f "$file" ] && cp "$file" /tmp/final-diagnostics/; done
            git reset --hard HEAD
            git clean -fd
            rm -f \
              tools/architecture-closure-v2/a8-access-boundary-batch.js \
              tools/architecture-closure-v2/a8-migration-snapshot-root-batch.js \
              .github/workflows/a8-access-boundary-finalize.yml
            rm -rf diagnostics/a8/access-boundary
            mkdir -p diagnostics/a8/access-boundary
            cp -R /tmp/final-diagnostics/. diagnostics/a8/access-boundary/
            cat > diagnostics/a8/access-boundary/outcome.json <<JSON
          {
            "schemaVersion": 1,
            "ok": false,
            "patch": "$PATCH_OUTCOME",
            "syntax": "$SYNTAX_OUTCOME",
            "capability": "$CAPABILITY_OUTCOME",
            "inventory": "$INVENTORY_OUTCOME",
            "a6": "$A6_OUTCOME",
            "regression": "$REGRESSION_OUTCOME",
            "integrity": "$INTEGRITY_OUTCOME"
          }
          JSON
            git add -A
            git add -f diagnostics/a8/access-boundary
            git commit -m "audit(a8): persist final access-boundary diagnostics"
          fi
          git push origin HEAD:acv2/wp-a-a8-batch-root-fix
