name: Multibridge Lab Native Process

on:
  push:
    branches:
      - lab/multibridge-recovery-plan-20260811
    paths:
      - tools/multibridge-lab/**
      - tests/multibridge-lab/**
      - .github/workflows/multibridge-lab-native-process.yml
      - .github/workflows/multibridge-lab-pinned-db-image-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-process-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Verify runtime identity
        shell: pwsh
        run: |
          node --version
          $PSVersionTable | Format-List | Out-String | Write-Host
          if (-not (Get-Command powershell.exe -ErrorAction SilentlyContinue)) { throw 'Windows PowerShell 5.1 is required for the legacy regression proof' }
      - name: Run Multibridge Lab contracts
        shell: pwsh
        run: node --test tests/multibridge-lab/*.test.js
      - name: Stage exact GREEN exit11 evidence package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'artifacts/multibridge-lab/exit11-user-package'
          if (-not (Test-Path -LiteralPath $source -PathType Container)) { throw "Missing sealed package source: $source" }
          $stage = Join-Path $env:RUNNER_TEMP 'exit11-user-package'
          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $source 'collect-exit11-evidence.ps1') -Destination (Join-Path $stage 'collect-exit11-evidence.ps1')
          Copy-Item -LiteralPath (Join-Path $source 'README.txt') -Destination (Join-Path $stage 'README.txt')
          Copy-Item -LiteralPath (Join-Path $source 'SHA256SUMS.txt') -Destination (Join-Path $stage 'SHA256SUMS.txt')
          $zip = Join-Path $env:RUNNER_TEMP 'yance-multibridge-exit11-evidence.zip'
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -LiteralPath (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP_SHA256=$zipHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP_SHA256=$zipHash"
      - name: Upload exact exit11 evidence package
        uses: actions/upload-artifact@v4
        with:
          name: yance-multibridge-exit11-evidence
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
      - name: Upload exit11 evidence verification record
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $record = Join-Path $env:RUNNER_TEMP 'exit11-evidence-verification.txt'
          @(
            "commit=$env:GITHUB_SHA"
            "zip_sha256=$env:ZIP_SHA256"
            "collector_blob=7809628d25c95207fbe9167f7fa54b8ae9b67ac0"
            "helper_blob=7b36cbfc9c5050355272a65390290506d8624f15"
            "fatal_context_blob=8b7141b948c4786c910ba1ad65d7c4dc71049d2"
            "package_test_blob=0b6707de9c7ec558c79e2f51a5503ebb0631bc02"
          ) | Set-Content -LiteralPath $record -Encoding utf8
          "VERIFICATION_PATH=$record" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: yance-multibridge-exit11-evidence-verification
          path: ${{ env.VERIFICATION_PATH }}
          if-no-files-found: error
