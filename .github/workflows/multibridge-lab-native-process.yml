name: Multibridge Lab Native Process

on:
  push:
    branches:
      - lab/multibridge-recovery-plan-20260811
    paths:
      - tools/multibridge-lab/**
      - tests/multibridge-lab/**
      - .github/workflows/multibridge-lab-native-process.yml
      - .github/workflows/multibridge-lab-pinned-db-image-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-process-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Verify runtime identity
        shell: pwsh
        run: |
          node --version
          $PSVersionTable | Format-List | Out-String | Write-Host
          if (-not (Get-Command powershell.exe -ErrorAction SilentlyContinue)) { throw 'Windows PowerShell 5.1 is required for the legacy regression proof' }
      - name: Run Multibridge Lab contracts
        shell: pwsh
        run: node --test tests/multibridge-lab/*.test.js
      - name: Enforce retired mautrix-manager source-launch security boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $retiredFiles = @(
            'tools/multibridge-lab/RUN_FACEBOOK_PERSONAL_MANAGER_SOURCE.cmd',
            'tools/multibridge-lab/FACEBOOK_PERSONAL_MANAGER_SOURCE_README.txt'
          )
          foreach ($path in $retiredFiles) {
            if (Test-Path -LiteralPath $path) { throw "Retired vulnerable manager source-launch path reappeared: $path" }
          }
          Write-Host 'MAUTRIX_MANAGER_SOURCE_LAUNCH_RETIRED_SECURITY_RED'
      - name: Guard retired unsigned mautrix-manager Windows release payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseCommit = 'd2c08e60c7a877602bc6da2961daf2daffcff79b'
          $assetId = '495351157'
          $assetName = 'mautrix_manager-0.2.1-full.nupkg'
          $expectedSha256 = '0ab5a822f7c1ceb830811972fb98d9849cf17080c54f2d8d6583b0b9802721ed'
          $assetApi = "https://api.github.com/repos/mautrix/manager/releases/assets/$assetId"
          $tagApi = 'https://api.github.com/repos/mautrix/manager/git/ref/tags/v0.2.1'
          $workRoot = Join-Path $env:RUNNER_TEMP 'mautrix-manager-v0.2.1-windows-retired'
          $nupkgPath = Join-Path $workRoot $assetName
          $zipPath = Join-Path $workRoot 'mautrix-manager-release.zip'
          $extractRoot = Join-Path $workRoot 'payload'
          Remove-Item $workRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $workRoot | Out-Null

          $headers = @{
            Accept = 'application/octet-stream'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'Yance-Multibridge-Lab'
          }
          $tagHeaders = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'Yance-Multibridge-Lab'
          }
          $tag = Invoke-RestMethod -Uri $tagApi -Headers $tagHeaders
          if ([string]$tag.object.type -ne 'commit' -or [string]$tag.object.sha -ne $releaseCommit) {
            throw "mautrix-manager v0.2.1 tag identity changed: $($tag.object.type) $($tag.object.sha)"
          }

          Invoke-WebRequest -Uri $assetApi -Headers $headers -OutFile $nupkgPath
          if (-not (Test-Path -LiteralPath $nupkgPath -PathType Leaf)) { throw 'Official mautrix-manager Windows nupkg was not downloaded.' }
          $actualSha256 = (Get-FileHash -LiteralPath $nupkgPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Official mautrix-manager Windows nupkg SHA256 changed: $actualSha256"
          }

          Copy-Item -LiteralPath $nupkgPath -Destination $zipPath
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractRoot -Force
          $exePath = Join-Path $extractRoot 'lib/net45/mautrix-manager.exe'
          if (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) { throw 'Official nupkg payload layout changed.' }
          $signature = Get-AuthenticodeSignature -FilePath $exePath
          Write-Host "Internal Authenticode status=$($signature.Status)"
          if ([string]$signature.Status -ne 'NotSigned') {
            throw "Windows manager release trust state changed; re-review required: status=$($signature.Status)"
          }
          Write-Host 'MAUTRIX_MANAGER_WINDOWS_RELEASE_RETIRED_UNSIGNED_RED'
      - name: Stage exact GREEN exit11 evidence package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = 'tools/multibridge-lab'
          $packageRoot = 'dist/multibridge-exit11-evidence'
          $verificationRoot = 'dist/multibridge-exit11-verification'
          $expected = [ordered]@{
            'RUN_EXIT11_EVIDENCE.cmd' = 'c9afd263cc5b89486ff937a195e9313bdce9c32a'
            'collect-exit11-evidence.ps1' = '886b3a792c6753b022cc716b07ff44be4b2389a3'
            'native-process.ps1' = '47d56b8e6561676eec75b814c1ed1ebaa8ba30d5'
          }

          Remove-Item $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $verificationRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $packageRoot, $verificationRoot | Out-Null

          foreach ($entry in $expected.GetEnumerator()) {
            $source = Join-Path $sourceRoot $entry.Key
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Missing exact runtime source: $source" }
            $blob = (git hash-object -- $source).Trim()
            if ($LASTEXITCODE -ne 0 -or $blob -ne $entry.Value) {
              throw "Runtime Git blob mismatch for $($entry.Key): expected $($entry.Value), got $blob"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path $packageRoot $entry.Key)
          }

          $actualNames = @(Get-ChildItem -LiteralPath $packageRoot -File | Sort-Object Name | ForEach-Object Name)
          $expectedNames = @($expected.Keys | Sort-Object)
          if (($actualNames -join "`n") -ne ($expectedNames -join "`n")) {
            throw "Package staging file-set mismatch. actual=$($actualNames -join ',')"
          }

          $manifestPath = Join-Path $verificationRoot 'SHA256SUMS.txt'
          $manifestLines = foreach ($name in $expectedNames) {
            $hash = (Get-FileHash -LiteralPath (Join-Path $packageRoot $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          [IO.File]::WriteAllLines($manifestPath, $manifestLines, [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllLines((Join-Path $verificationRoot 'SOURCE.txt'), @(
            "tested_commit=$env:GITHUB_SHA",
            'wrapper_blob=c9afd263cc5b89486ff937a195e9313bdce9c32a',
            'collector_blob=886b3a792c6753b022cc716b07ff44be4b2389a3',
            'helper_blob=47d56b8e6561676eec75b814c1ed1ebaa8ba30d5'
          ), [Text.UTF8Encoding]::new($false))

          Write-Host 'PACKAGE_FILE_SET=GREEN'
          Get-Content -LiteralPath $manifestPath
      - name: Upload exact exit11 evidence package
        uses: actions/upload-artifact@v4
        with:
          name: yance-multibridge-exit11-evidence-package
          path: dist/multibridge-exit11-evidence
          if-no-files-found: error
      - name: Upload exit11 evidence verification record
        uses: actions/upload-artifact@v4
        with:
          name: yance-multibridge-exit11-evidence-verification
          path: dist/multibridge-exit11-verification
          if-no-files-found: error
      - name: Stage final R12 runtime repair readiness package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageRoot = 'dist/multibridge-r12-runtime-repair-readiness'
          Remove-Item $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null

          $files = [ordered]@{
            'tools/multibridge-lab/RUN_R12_RUNTIME_REPAIR_READINESS.cmd' = 'RUN_R12_RUNTIME_REPAIR_READINESS.cmd'
            'tools/multibridge-lab/r12-runtime-repair-readiness.ps1' = 'r12-runtime-repair-readiness.ps1'
            'tools/multibridge-lab/R12_RUNTIME_REPAIR_READINESS_README.txt' = 'R12_RUNTIME_REPAIR_READINESS_README.txt'
            'tools/multibridge-lab/r12-database-wiring.ps1' = 'r12-database-wiring.ps1'
            'tools/multibridge-lab/native-process.ps1' = 'native-process.ps1'
            'tests/multibridge-lab/fixtures/runtime-login-flow-authorities.json' = 'runtime-login-flow-authorities.json'
          }

          foreach ($entry in $files.GetEnumerator()) {
            if (-not (Test-Path -LiteralPath $entry.Key -PathType Leaf)) { throw "Missing runtime readiness package source: $($entry.Key)" }
            Copy-Item -LiteralPath $entry.Key -Destination (Join-Path $packageRoot $entry.Value)
          }

          $targetScript = (Resolve-Path 'tools/multibridge-lab/r12-runtime-repair-readiness.ps1').Path
          $tokens = $null
          $parseErrors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
            $targetScript,
            [ref]$tokens,
            [ref]$parseErrors
          )
          if (@($parseErrors).Count -ne 0) {
            throw "Runtime readiness PowerShell 7 parse RED: $($parseErrors[0].Message)"
          }

          $ps51ParseGate = Join-Path $env:RUNNER_TEMP 'parse-r12-runtime-readiness-ps51.ps1'
          $ps51ParseGateBody = @'
          param([Parameter(Mandatory = $true)][string]$Target)
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($Target, [ref]$tokens, [ref]$parseErrors)
          if (@($parseErrors).Count -ne 0) {
            Write-Error ("Windows PowerShell 5.1 parse RED: " + $parseErrors[0].Message)
            exit 1
          }
          Write-Output 'WINDOWS_POWERSHELL_5_1_PARSE_GREEN'
          '@
          [IO.File]::WriteAllText($ps51ParseGate, $ps51ParseGateBody, [Text.Encoding]::ASCII)
          & powershell.exe -NoLogo -NoProfile -NonInteractive -File $ps51ParseGate -Target $targetScript
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 parse gate failed.' }

          $motwFiles = @(
            'r12-runtime-repair-readiness.ps1',
            'r12-database-wiring.ps1',
            'native-process.ps1'
          )
          foreach ($name in $motwFiles) {
            $stagedPath = (Resolve-Path (Join-Path $packageRoot $name)).Path
            [IO.File]::WriteAllText(
              $stagedPath + ':Zone.Identifier',
              "[ZoneTransfer]`r`nZoneId=3`r`n",
              [Text.Encoding]::ASCII
            )
            $zone = [IO.File]::ReadAllText($stagedPath + ':Zone.Identifier')
            if ($zone -notmatch 'ZoneId=3') { throw "Could not reproduce Mark-of-the-Web for $name" }
          }

          $wrapperPath = (Resolve-Path (Join-Path $packageRoot 'RUN_R12_RUNTIME_REPAIR_READINESS.cmd')).Path
          $previousPolicyPreference = $env:PSExecutionPolicyPreference
          try {
            $env:PSExecutionPolicyPreference = 'RemoteSigned'
            $cmdLine = '(echo.)|call "' + $wrapperPath + '" -LabRoot "Z:\YANCE-MOTW-MISSING-LAB"'
            $motwOutput = (& cmd.exe /d /s /c $cmdLine 2>&1 | Out-String)
            $motwExitCode = $LASTEXITCODE
          }
          finally {
            if ($null -eq $previousPolicyPreference) {
              Remove-Item Env:PSExecutionPolicyPreference -ErrorAction SilentlyContinue
            }
            else {
              $env:PSExecutionPolicyPreference = $previousPolicyPreference
            }
          }

          $motwOutput | Write-Host
          if ($motwExitCode -ne 1) { throw "Expected controlled missing-Lab REAL_RED exit 1, got $motwExitCode" }
          if ($motwOutput -notmatch 'PACKAGE_INTEGRITY_GREEN') { throw 'MotW wrapper did not verify sealed package bytes.' }
          if ($motwOutput -notmatch 'PACKAGE_MOTW_RELEASE_GREEN') { throw 'MotW wrapper did not release the exact verified PowerShell files.' }
          if ($motwOutput -notmatch 'FINAL STATUS: REAL_RED') { throw 'MotW wrapper did not reach the real runtime script boundary.' }
          if ($motwOutput -match 'PSSecurityException|UnauthorizedAccess|digitally signed') { throw 'MotW wrapper remained blocked by PowerShell execution policy.' }
          Write-Host 'MOTW_BOOTSTRAP_GREEN'
          $global:LASTEXITCODE = 0

          $manifest = foreach ($name in @($files.Values | Sort-Object)) {
            $hash = (Get-FileHash -LiteralPath (Join-Path $packageRoot $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          [IO.File]::WriteAllLines((Join-Path $packageRoot 'SHA256SUMS.txt'), $manifest, [Text.UTF8Encoding]::new($false))
          Write-Host 'R12_RUNTIME_REPAIR_READINESS_PACKAGE_GREEN'
          $manifest
      - name: Upload final R12 runtime repair readiness package
        uses: actions/upload-artifact@v4
        with:
          name: yance-multibridge-r12-runtime-repair-readiness
          path: dist/multibridge-r12-runtime-repair-readiness
          if-no-files-found: error

  manager-linux-release:
    name: manager-linux-release
    runs-on: ubuntu-latest
    steps:
      - name: Validate official mautrix-manager Linux x64 release payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_commit='d2c08e60c7a877602bc6da2961daf2daffcff79b'
          asset_id='495350343'
          asset_name='mautrix-manager-linux-x64-0.2.1.zip'
          expected_sha256='8a55dc5022c5d52d13c58e05c72ad2d0bfff3fa9dac19d96e5eb84608f282479'
          work_root="$RUNNER_TEMP/mautrix-manager-v0.2.1-linux-x64"
          zip_path="$work_root/$asset_name"
          extract_root="$work_root/payload"
          rm -rf "$work_root"
          mkdir -p "$extract_root"

          tag_json="$(curl --fail --silent --show-error --location \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/mautrix/manager/git/ref/tags/v0.2.1)"
          tag_sha="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["object"]["sha"] if d["object"]["type"] == "commit" else "")' <<<"$tag_json")"
          test "$tag_sha" = "$release_commit"

          curl --fail --silent --show-error --location \
            --header 'Accept: application/octet-stream' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$zip_path" \
            "https://api.github.com/repos/mautrix/manager/releases/assets/$asset_id"
          echo "$expected_sha256  $zip_path" | sha256sum --check --strict
          echo "MAUTRIX_MANAGER_LINUX_RELEASE_SHA256_GREEN=$expected_sha256"

          unzip -q "$zip_path" -d "$extract_root"
          mapfile -t candidates < <(find "$extract_root" -type f -name 'mautrix-manager' -print)
          if [ "${#candidates[@]}" -ne 1 ]; then
            printf 'Expected exactly one mautrix-manager executable, found %s\n' "${#candidates[@]}" >&2
            printf '%s\n' "${candidates[@]:-}" >&2
            exit 31
          fi
          exe="${candidates[0]}"
          chmod u+x "$exe"
          identity="$(file "$exe")"
          printf '%s\n' "$identity"
          grep -Fq 'ELF 64-bit' <<<"$identity"
          grep -Eq 'x86-64|x86_64' <<<"$identity"
          echo 'MAUTRIX_MANAGER_LINUX_ELF_IDENTITY_GREEN'

          echo '=== ldd ==='
          ldd "$exe" | tee "$work_root/ldd.txt"
          if grep -Fq 'not found' "$work_root/ldd.txt"; then
            echo 'Linux manager has missing shared libraries.' >&2
            exit 33
          fi

          payload_dir="$(dirname "$exe")"
          sandbox="$payload_dir/chrome-sandbox"
          echo '=== chrome-sandbox ==='
          if [ -e "$sandbox" ]; then
            stat -c 'path=%n owner=%U group=%G mode=%a uid=%u gid=%g' "$sandbox"
          else
            echo 'chrome-sandbox=missing'
          fi

          echo '=== user namespace / AppArmor ==='
          if [ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            apparmor_userns="$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
            echo "kernel.apparmor_restrict_unprivileged_userns=$apparmor_userns"
          else
            echo 'kernel.apparmor_restrict_unprivileged_userns=unavailable'
          fi
          set +e
          unshare --user --map-root-user true
          unshare_rc=$?
          set -e
          echo "unshare_user_exit=$unshare_rc"
          echo 'MAUTRIX_MANAGER_LINUX_SMOKE_DIAGNOSTICS'

          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

          set +e
          timeout --signal=TERM --kill-after=3s 8s xvfb-run -a "$exe" >"$work_root/stdout.txt" 2>"$work_root/stderr.txt"
          smoke_rc=$?
          set -e
          if [ "$smoke_rc" -ne 124 ]; then
            echo "Official Linux manager payload exited before the 8-second no-login smoke window: exit=$smoke_rc" >&2
            echo '=== bounded stdout ===' >&2
            sed -n '1,80p' "$work_root/stdout.txt" >&2 || true
            echo '=== bounded stderr ===' >&2
            sed -n '1,80p' "$work_root/stderr.txt" >&2 || true
            exit 32
          fi
          echo 'MAUTRIX_MANAGER_LINUX_RELEASE_PAYLOAD_SMOKE_GREEN'
