name: OSS-1A Task 6 Candidate Builder

on:
  push:
    branches:
      - work/oss1a-task6-generator

permissions:
  contents: write

jobs:
  build-candidate:
    if: ${{ github.event.head_commit.message == 'tooling(oss1a): run isolated Task 6 generator' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact tooling head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 1
          fetch-tags: false
          lfs: false
          persist-credentials: false

      - name: Checkout exact implementation RED head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 012a7e539d2c44f4b415a3e5bcf5eae20552c1f6
          path: candidate
          fetch-depth: 0
          fetch-tags: false
          lfs: false
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install locked dependencies
        working-directory: candidate
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate root Task 6 implementation
        working-directory: candidate
        run: python ../tooling/tools/oss1a/generate_task6_candidate.py

      - name: Verify generated candidate
        working-directory: candidate
        run: |
          node --check backend/services/whatsappBaileysEventProcessor.js
          node --check backend/services/whatsappAdapter.js
          node --test --test-concurrency=1 backend/tests/oss1aWhatsappAuthSchema.test.js

      - name: Commit isolated candidate
        working-directory: candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c work/oss1a-task6-candidate
          git add backend/services/whatsappBaileysEventProcessor.js backend/services/whatsappAdapter.js backend/tests/batch39WhatsappSessionFence.test.js
          git diff --cached --check
          git commit -m 'refactor(oss1a): process Baileys events as one ordered batch'
          git push origin HEAD:refs/heads/work/oss1a-task6-candidate
