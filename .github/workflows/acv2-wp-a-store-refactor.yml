name: ACV2 WP-A Store Refactor

on:
  push:
    branches:
      - acv2/wp-a-identity-ledger-write-host

permissions:
  contents: write

jobs:
  apply-store-refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact WP-A branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: acv2/wp-a-identity-ledger-write-host
          fetch-depth: 0
          fetch-tags: false
      - name: Apply fail-closed store refactor
        run: node tools/architecture-closure-v2/apply-a1-store-refactor.js
      - name: Verify only the intended store file changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "backend/lib/r32SqliteStore.js"
          node --check backend/lib/r32SqliteStore.js
      - name: Commit refactored store
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/lib/r32SqliteStore.js
          git commit -m "refactor(acv2): bind R32 store to AuthorityWriteHost fencing"
          git push origin HEAD:acv2/wp-a-identity-ledger-write-host
