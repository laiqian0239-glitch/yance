name: OSS1A Tooling Export

on:
  push:
    branches:
      - work/oss1a-minimal-ready-authority-patch
    paths:
      - .github/workflows/oss1a-tooling-export.yml
      - tests/wp0/oss1a-generate-minimal-ready-authority-blob.test.js

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tooling head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Generate and verify audited Backend host blob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { generatePatchedBackendProcessHost } = require('./tests/wp0/oss1a-generate-minimal-ready-authority-blob.test.js');
          const result = generatePatchedBackendProcessHost();
          const actual = crypto.createHash('sha256').update(result.code).digest('hex');
          if (actual !== result.sha256) throw new Error(`generated SHA mismatch: ${actual} != ${result.sha256}`);
          fs.writeFileSync('artifact/BackendProcessHost.js', result.code);
          fs.writeFileSync('artifact/SHA256SUMS', `${result.sha256}  BackendProcessHost.js\n`, 'utf8');
          NODE
          (cd artifact && sha256sum --check --strict SHA256SUMS)
          node --check artifact/BackendProcessHost.js
      - name: Upload exact generated blob
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oss1a-backend-process-host-minimal-patch
          path: artifact/
          if-no-files-found: error
          retention-days: 1
      - name: Publish isolated candidate commit
        shell: bash
        env:
          IMPLEMENTATION_PARENT: a24a8710d441cae37f6c6e9e5f04867a51abb00e
          CANDIDATE_BRANCH: work/oss1a-backend-ready-authority-candidate
        run: |
          set -euo pipefail
          test -z "$(git ls-remote --heads origin "refs/heads/${CANDIDATE_BRANCH}")"
          git cat-file -e "${IMPLEMENTATION_PARENT}^{commit}"
          git checkout --detach "${IMPLEMENTATION_PARENT}"
          cp artifact/BackendProcessHost.js electron/desktopHost/BackendProcessHost.js
          git add electron/desktopHost/BackendProcessHost.js
          test "$(git diff --cached --name-only)" = "electron/desktopHost/BackendProcessHost.js"
          git diff --cached --check
          git config user.name "Yance OSS1A Tooling"
          git config user.email "oss1a-tooling@users.noreply.github.com"
          git commit -m "fix(oss1a): validate pre-ready FD6 authority in backend host"
          git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
