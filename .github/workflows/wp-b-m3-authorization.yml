name: WP-B M3 Authorization

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/wp-b-m3-authorization.yml
      - backend/services/durableInternalOperationAuthority.js
      - backend/tests/architectureClosureV2/wpB/m3Authorization.test.js
      - governance/architecture-closure-v2/wp-b-m2-review.json
      - governance/architecture-closure-v2/wp-b-m3-authorization.json
      - governance/architecture-closure-v2/wp-b-operation-inventory-m3-extension.json
      - governance/architecture-closure-v2/wp-b-operation-inventory.json
      - governance/architecture-closure-v2/wp-b-source-closure-baseline.json
      - shared/release/acv2ActiveWorkPackageAuthority.js
      - tools/architecture-closure-v2/discover-wp-b-operation-call-sites.js
      - tools/architecture-closure-v2/source-closure-scan.js
      - tools/architecture-closure-v2/verify-wp-b-m2-review.js
      - tools/architecture-closure-v2/verify-wp-b-m3-authorization.js
      - tests/wp0/acv2-work-package-scope-wiring.test.js
      - tests/wp0/implementation-branch-policy.test.js
  push:
    branches:
      - acv2/wp-b-durable-execution-outbox
    paths:
      - .github/workflows/wp-b-m3-authorization.yml
      - backend/services/durableInternalOperationAuthority.js
      - backend/tests/architectureClosureV2/wpB/m3Authorization.test.js
      - governance/architecture-closure-v2/wp-b-m2-review.json
      - governance/architecture-closure-v2/wp-b-m3-authorization.json
      - governance/architecture-closure-v2/wp-b-operation-inventory-m3-extension.json
      - governance/architecture-closure-v2/wp-b-operation-inventory.json
      - governance/architecture-closure-v2/wp-b-source-closure-baseline.json
      - shared/release/acv2ActiveWorkPackageAuthority.js
      - tools/architecture-closure-v2/discover-wp-b-operation-call-sites.js
      - tools/architecture-closure-v2/source-closure-scan.js
      - tools/architecture-closure-v2/verify-wp-b-m2-review.js
      - tools/architecture-closure-v2/verify-wp-b-m3-authorization.js
      - tests/wp0/acv2-work-package-scope-wiring.test.js
      - tests/wp0/implementation-branch-policy.test.js
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  EVENT_NAME: ${{ github.event_name }}
  IMPLEMENTATION_BRANCH: ${{ github.head_ref || github.ref_name }}
  PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  authorization-contracts:
    name: wp-b-m3-authorization-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout exact authorization commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.VALIDATION_SHA }}
          fetch-depth: 0
          fetch-tags: false
          lfs: false
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Establish exact trusted implementation branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${VALIDATION_SHA}"
          git fetch --no-tags --force origin "${IMPLEMENTATION_BRANCH}:refs/remotes/origin/${IMPLEMENTATION_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${IMPLEMENTATION_BRANCH})" = "${VALIDATION_SHA}"

          case "${EVENT_NAME}" in
            pull_request)
              TRUSTED_POLICY_SHA="${PULL_REQUEST_BASE_SHA}"
              ;;
            push|workflow_dispatch)
              git fetch --no-tags --force origin main:refs/remotes/origin/main
              TRUSTED_POLICY_SHA="$(git rev-parse refs/remotes/origin/main)"
              ;;
            *)
              echo "WP_B_M3_UNSUPPORTED_EVENT=${EVENT_NAME}" >&2
              exit 1
              ;;
          esac
          [[ "${TRUSTED_POLICY_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${TRUSTED_POLICY_SHA}^{commit}"

          TRUSTED_POLICY_ROOT="../yance-wp-b-m3-trusted-policy"
          git worktree remove --force "${TRUSTED_POLICY_ROOT}" >/dev/null 2>&1 || true
          rm -rf "${TRUSTED_POLICY_ROOT}"
          GIT_LFS_SKIP_SMUDGE=1 git worktree add --detach "${TRUSTED_POLICY_ROOT}" "${TRUSTED_POLICY_SHA}"
          test "$(git -C "${TRUSTED_POLICY_ROOT}" rev-parse HEAD)" = "${TRUSTED_POLICY_SHA}"
          for repo_path in \
            shared/release/implementationBranchPolicy.js \
            shared/release/implementationBranchPolicyLegacy.js \
            release/release-source.json
          do
            expected_blob="$(git rev-parse "${TRUSTED_POLICY_SHA}:${repo_path}")"
            actual_blob="$(git hash-object "${TRUSTED_POLICY_ROOT}/${repo_path}")"
            test "${actual_blob}" = "${expected_blob}"
          done
          TRUSTED_POLICY_ROOT="$(cd "${TRUSTED_POLICY_ROOT}" && pwd -P)"
          export TRUSTED_POLICY_ROOT TRUSTED_POLICY_SHA
          node <<'NODE'
          const path = require('node:path');
          const root = process.env.TRUSTED_POLICY_ROOT;
          const trustedMainHead = process.env.TRUSTED_POLICY_SHA;
          const evaluatedHead = process.env.VALIDATION_SHA;
          const branch = process.env.IMPLEMENTATION_BRANCH;
          const releaseSource = require(path.join(root, 'release/release-source.json'));
          const policy = require(path.join(root, 'shared/release/implementationBranchPolicy'));
          const authorized = policy.isAuthorizedImplementationBranch(branch, releaseSource.stageVersion, {
            delegatedGovernance: { trustedMainHead, evaluatedHead }
          });
          if (!authorized) {
            console.error('WP_B_M3_IMPLEMENTATION_BRANCH_UNAUTHORIZED');
            process.exit(1);
          }
          NODE

          {
            echo "TRUSTED_POLICY_ROOT=${TRUSTED_POLICY_ROOT}"
            echo "TRUSTED_POLICY_SHA=${TRUSTED_POLICY_SHA}"
          } >> "${GITHUB_ENV}"

          git switch --force-create "${IMPLEMENTATION_BRANCH}" "${VALIDATION_SHA}"
          test "$(git branch --show-current)" = "${IMPLEMENTATION_BRANCH}"
          test "$(git rev-parse HEAD)" = "${VALIDATION_SHA}"

      - name: Validate authorization syntax
        shell: bash
        run: |
          node --check backend/tests/architectureClosureV2/wpB/m3Authorization.test.js
          node --check tools/architecture-closure-v2/discover-wp-b-operation-call-sites.js
          node --check tools/architecture-closure-v2/source-closure-scan.js
          node --check tools/architecture-closure-v2/verify-wp-b-m3-authorization.js
          node --check shared/release/acv2ActiveWorkPackageAuthority.js

      - name: Run Milestone 3 authorization and WP0 wiring contracts
        shell: bash
        run: |
          node --test --test-concurrency=1 \
            backend/tests/architectureClosureV2/wpB/m3Authorization.test.js \
            tests/wp0/acv2-work-package-scope-wiring.test.js \
            tests/wp0/implementation-branch-policy.test.js

      - name: Verify standalone Milestone 3 authorization locally and remotely
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/architecture-closure-v2/verify-wp-b-m3-authorization.js --remote

      - name: Confirm clean validation workspace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  gate:
    name: wp-b-m3-authorization-gate
    if: ${{ always() }}
    needs:
      - authorization-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Enforce authorization contracts
        shell: bash
        env:
          AUTHORIZATION_RESULT: ${{ needs.authorization-contracts.result }}
        run: |
          set -euo pipefail
          test "${AUTHORIZATION_RESULT}" = "success"
