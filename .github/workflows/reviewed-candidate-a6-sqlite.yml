name: A6 Reviewed SQLite Legacy Verification

on:
  push:
    branches:
      - governance/layered-ci-reviewed-candidate
  pull_request:
    branches:
      - main
    paths:
      - 'governance/layered-ci/**'
      - 'tools/layered-ci/**'
      - 'tests/layered-ci/**'
      - '.github/workflows/reviewed-candidate-a6*.yml'

permissions:
  contents: read

env:
  IMPLEMENTATION_BRANCH: acv2/wp-a-identity-ledger-write-host
  GOVERNANCE_BASE_SHA: d81599d8a3f3de891da369b6f1ddbd01e264c78d
  REVIEWED_HEAD_SHA: 3684dbd840faec8d6e732b0b68eae25f1ad9b2b3
  BRANCH_TIP_SHA: e877aec9e16663296e632c224a1da3b7892f1f2b
  CANDIDATE_MANIFEST: governance/layered-ci/reviewed-candidate-a6.json

jobs:
  a6-reviewed-sqlite-legacy:
    name: a6-reviewed-sqlite-legacy-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout governance verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: false
          lfs: false
      - name: Set up Node.js for candidate verification
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Fetch and verify exact reviewed candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin "${IMPLEMENTATION_BRANCH}:refs/remotes/origin/${IMPLEMENTATION_BRANCH}"
          git fetch --no-tags --force origin "${GOVERNANCE_BASE_SHA}"
          git fetch --no-tags --force origin "${REVIEWED_HEAD_SHA}"
          git fetch --no-tags --force origin "${BRANCH_TIP_SHA}"
          node tools/layered-ci/verify-reviewed-candidate.js "${CANDIDATE_MANIFEST}"
      - name: Checkout exact reviewed A6 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.REVIEWED_HEAD_SHA }}
          fetch-depth: 1
          fetch-tags: false
          lfs: false
          persist-credentials: false
      - name: Set up reviewed Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run unfiltered SQLite ownership and fencing regressions
        run: >-
          node --test --test-concurrency=1
          tests/wp5/m5-sqlite-ownership.test.js
          tests/wp4/application-matrix-temp-path.test.js
          tests/wp3/stale-fencing-token-outbox-denied.test.js
