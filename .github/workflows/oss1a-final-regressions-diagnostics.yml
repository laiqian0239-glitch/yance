name: OSS-1A Final Authorized Regression Diagnostics

on:
  push:
    branches:
      - diagnostic/oss1a-final-regressions-a4f0fdb8

permissions:
  contents: read

env:
  IMPLEMENTATION_HEAD: a4f0fdb8b8a66b99e4b0efb56d756b25b197735f

jobs:
  existing-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.IMPLEMENTATION_HEAD }}
          fetch-depth: 1
          fetch-tags: false
          lfs: false
          persist-credentials: false
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${IMPLEMENTATION_HEAD}"
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run exact unchanged authorized regressions
        run: >-
          node --test --test-concurrency=1
          backend/tests/messageIdentityEvidenceOrdering.test.js
          backend/tests/platformProductionReadinessAuthority.test.js
      - name: Run complete Task 11 existing regression list
        run: >-
          node --test --test-concurrency=1
          backend/tests/batch39WhatsappSessionFence.test.js
          backend/tests/batch40ChannelAbortPropagation.test.js
          backend/tests/whatsappReceiptRecoveryRegression.test.js
          backend/tests/whatsappQrChallenge.test.js
          backend/tests/whatsappCanonicalGuardRegression.test.js
          backend/tests/whatsappMediaRecoveryClosure.test.js
          backend/tests/whatsappOrphanAccountReconciliation.test.js
          backend/tests/accountLifecycleRegression.test.js
          backend/tests/platformProductionReadinessAuthority.test.js

  registration-boundary-relocation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.IMPLEMENTATION_HEAD }}
          fetch-depth: 1
          fetch-tags: false
          lfs: false
          persist-credentials: false
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${IMPLEMENTATION_HEAD}"
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Relocate registration boundary contract into authorized legacy suite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('backend/tests/oss1aWhatsappRegistrationIdZero.test.js')
          target = Path('backend/tests/oss1aWhatsappLegacyAuthImport.test.js')
          text = source.read_text()
          marker = 'function credentialStateForRegistrationId(registrationId) {'
          start = text.index(marker)
          target.write_text(target.read_text().rstrip() + '\n\n' + text[start:].lstrip())
          source.unlink()
          PY
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' backend/tests/oss1aWhatsappLegacyAuthImport.test.js backend/tests/oss1aWhatsappRegistrationIdZero.test.js | sort)"
      - name: Run relocated registration and legacy import contracts
        run: node --test --test-concurrency=1 backend/tests/oss1aWhatsappLegacyAuthImport.test.js
      - name: Prove no standalone unauthorized path remains
        run: test ! -e backend/tests/oss1aWhatsappRegistrationIdZero.test.js
