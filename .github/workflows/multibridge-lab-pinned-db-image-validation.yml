name: Multibridge Lab Pinned DB Image Validation

on:
  push:
    branches:
      - lab/multibridge-recovery-plan-20260811
    paths:
      - tools/multibridge-lab/r12-database-wiring.ps1
      - tests/multibridge-lab/fixtures/upstream-database-validator-authorities.json
      - .github/workflows/multibridge-lab-pinned-db-image-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-db-image:
    name: pinned-db-image-${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: instagram-dm
            repository: mautrix/meta
            commit: a0db68a56bb5715d67faa331f647e771d62b05a2
            dockerfile: Dockerfile.ig
            binary: /usr/bin/mautrix-instagram
            submodule_path: ""
            submodule_commit: ""
          - service: google-messages
            repository: mautrix/gmessages
            commit: 2f2a1efa59a1bfbfb0ab1570b0532a93baeeea96
            dockerfile: Dockerfile
            binary: /usr/bin/mautrix-gmessages
            submodule_path: ""
            submodule_commit: ""
          - service: signal
            repository: mautrix/signal
            commit: 8c7333a033cc8dbaf6676b1f9211d2906154277b
            dockerfile: Dockerfile
            binary: /usr/bin/mautrix-signal
            submodule_path: pkg/libsignalgo/libsignal
            submodule_commit: 857c4dca03537dc5e395a5e1eda6bf18f59c3601
    steps:
      - uses: actions/checkout@v4

      - name: Resolve recovered R12 database wiring
        id: wiring
        shell: pwsh
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tools/multibridge-lab/r12-database-wiring.ps1
          $wiring = Get-LabR12DatabaseWiring -Service $env:SERVICE
          if ($null -eq $wiring) { throw "Missing recovered R12 database wiring for $env:SERVICE" }
          if ($wiring.Type -ne 'sqlite3-fk-wal') { throw "Unexpected database type: $($wiring.Type)" }
          if ($wiring.Uri -ne "file:/data/$env:SERVICE.db?_txlock=immediate") { throw "Unexpected database URI: $($wiring.Uri)" }
          "db_type=$($wiring.Type)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "db_uri=$($wiring.Uri)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Fetch exact upstream source
        shell: bash
        env:
          REPOSITORY: ${{ matrix.repository }}
          SOURCE_COMMIT: ${{ matrix.commit }}
          SUBMODULE_PATH: ${{ matrix.submodule_path }}
          SUBMODULE_COMMIT: ${{ matrix.submodule_commit }}
        run: |
          set -euo pipefail
          rm -rf upstream
          git init upstream
          git -C upstream remote add origin "https://github.com/${REPOSITORY}.git"
          git -C upstream fetch --depth=1 origin "$SOURCE_COMMIT"
          git -C upstream checkout --detach FETCH_HEAD
          actual="$(git -C upstream rev-parse HEAD)"
          test "$actual" = "$SOURCE_COMMIT"
          echo "SOURCE_COMMIT_VERIFIED=$actual"
          if [ -n "$SUBMODULE_PATH" ]; then
            git -C upstream submodule update --init --recursive "$SUBMODULE_PATH"
            sub_actual="$(git -C "upstream/$SUBMODULE_PATH" rev-parse HEAD)"
            test "$sub_actual" = "$SUBMODULE_COMMIT"
            echo "SUBMODULE_COMMIT_VERIFIED=$sub_actual"
          fi

      - name: Build exact upstream image
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          image="yance-lab-dbcheck/${SERVICE}:${GITHUB_SHA}"
          docker build --file "upstream/$DOCKERFILE" --tag "$image" upstream
          image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "IMAGE_ID=$image_id" >> "$GITHUB_ENV"
          echo "IMAGE_ID=$image_id"

      - name: Exercise exact pinned binary with repaired DB config
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          SOURCE_COMMIT: ${{ matrix.commit }}
          BINARY: ${{ matrix.binary }}
          DB_TYPE: ${{ steps.wiring.outputs.db_type }}
          DB_URI: ${{ steps.wiring.outputs.db_uri }}
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/yance-dbcheck-$SERVICE"
          report="$RUNNER_TEMP/pinned-db-image-$SERVICE.txt"
          log="$RUNNER_TEMP/pinned-db-image-$SERVICE.log"
          rm -rf "$data"
          mkdir -p "$data"
          cid=""
          cleanup() {
            if [ -n "$cid" ]; then docker rm -f "$cid" >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT

          write_report() {
            local classification="$1"
            local state="$2"
            local exit_code="$3"
            local db_present="$4"
            {
              echo "service=$SERVICE"
              echo "source_commit=$SOURCE_COMMIT"
              echo "image_id=$IMAGE_ID"
              echo "state=$state"
              echo "exit_code=$exit_code"
              echo "database_file_present=$db_present"
              echo "classification=$classification"
            } > "$report"
          }

          docker run --rm \
            --entrypoint "$BINARY" \
            --volume "$data:/data" \
            "$IMAGE" -c /data/config.yaml -e
          test -f "$data/config.yaml"

          docker run --rm \
            --entrypoint sh \
            --volume "$data:/data" \
            --env DB_TYPE="$DB_TYPE" \
            --env DB_URI="$DB_URI" \
            "$IMAGE" -ceu '
              yq -I4 e -i '\''
                .homeserver.address = "http://127.0.0.1:9" |
                .homeserver.domain = "yance-lab.local" |
                .homeserver.software = "standard" |
                .database.type = strenv(DB_TYPE) |
                .database.uri = strenv(DB_URI)
              '\'' /data/config.yaml
            '

          docker run --rm \
            --entrypoint "$BINARY" \
            --volume "$data:/data" \
            "$IMAGE" -g -c /data/config.yaml -r /data/registration.yaml
          test -f "$data/registration.yaml"

          cid="$(docker run -d \
            --network none \
            --workdir /data \
            --entrypoint "$BINARY" \
            --volume "$data:/data" \
            "$IMAGE" -c /data/config.yaml)"

          sleep 12
          state="$(docker inspect --format '{{.State.Status}}' "$cid")"
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$cid")"
          docker logs "$cid" > "$log" 2>&1 || true

          db_file="$data/$SERVICE.db"
          db_present=false
          if [ -f "$db_file" ]; then db_present=true; fi

          if grep -Fq 'database.uri not configured' "$log"; then
            write_report DB_VALIDATION_FATAL_REPRODUCED "$state" "$exit_code" "$db_present"
            grep -E 'Configuration error|database\.uri|FTL' "$log" || true
            exit 31
          fi
          if grep -Fq 'Failed to initialize database' "$log"; then
            write_report DATABASE_INIT_RED "$state" "$exit_code" "$db_present"
            grep -E 'Failed to initialize database|FTL' "$log" || true
            exit 32
          fi
          if grep -Fq 'Configuration error' "$log"; then
            write_report LATER_CONFIGURATION_RED "$state" "$exit_code" "$db_present"
            grep -E 'Configuration error|FTL' "$log" || true
            exit 33
          fi
          if [ "$db_present" != true ]; then
            write_report DATABASE_FILE_NOT_CREATED "$state" "$exit_code" false
            exit 34
          fi

          if [ "$state" = running ]; then
            write_report PINNED_IMAGE_DB_STARTUP_GREEN "$state" "$exit_code" true
          else
            write_report DB_VALIDATION_GREEN_LATER_NONCONFIG_EXIT "$state" "$exit_code" true
          fi
          cat "$report"
          cp "$report" "$GITHUB_WORKSPACE/pinned-db-image-$SERVICE.txt"

      - name: Upload non-secret pinned image validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-db-image-${{ matrix.service }}
          path: pinned-db-image-${{ matrix.service }}.txt
          if-no-files-found: ignore
