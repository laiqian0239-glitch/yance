name: Seed trusted Electron LFS object

on:
  push:
    branches:
      - rebuild/windows-release-closure-20260802-gate0-wp0-fix
    paths:
      - .github/workflows/seed-electron-lfs-object.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seed-electron-v39-8-5-win32-x64
  cancel-in-progress: false

env:
  ELECTRON_PATH: vendor/electron/electron-v39.8.5-win32-x64.zip
  ELECTRON_URL: https://github.com/electron/electron/releases/download/v39.8.5/electron-v39.8.5-win32-x64.zip
  ELECTRON_OID: d75c0057fd58c08023ff82ed9dd38443f90b4a962c9a9359aa74d9070f4add34
  ELECTRON_SIZE: '136644393'
  GIT_TERMINAL_PROMPT: '0'

jobs:
  seed-lfs-object:
    if: >-
      github.repository == 'laiqian0239-glitch/yance' &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/rebuild/windows-release-closure-20260802-gate0-wp0-fix')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout trusted pointer without smudging LFS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: rebuild/windows-release-closure-20260802-gate0-wp0-fix
          fetch-depth: 1
          lfs: false
          persist-credentials: true
      - name: Verify tracked pointer contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git check-attr filter -- "${ELECTRON_PATH}" | awk '{print $3}')" = lfs
          grep -Fx "version https://git-lfs.github.com/spec/v1" "${ELECTRON_PATH}"
          grep -Fx "oid sha256:${ELECTRON_OID}" "${ELECTRON_PATH}"
          grep -Fx "size ${ELECTRON_SIZE}" "${ELECTRON_PATH}"
      - name: Download and verify official Electron archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/lfs-seed
          curl --fail --location --retry 4 --retry-all-errors \
            --output .tmp/lfs-seed/electron.zip \
            "${ELECTRON_URL}"
          echo "${ELECTRON_OID}  .tmp/lfs-seed/electron.zip" | sha256sum --check --strict
          test "$(stat --format='%s' .tmp/lfs-seed/electron.zip)" = "${ELECTRON_SIZE}"
      - name: Import verified bytes and push only the expected LFS object
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs clean "${ELECTRON_PATH}" < .tmp/lfs-seed/electron.zip > .tmp/lfs-seed/generated.pointer
          cmp --silent "${ELECTRON_PATH}" .tmp/lfs-seed/generated.pointer
          OBJECT_PATH=".git/lfs/objects/${ELECTRON_OID:0:2}/${ELECTRON_OID:2:2}/${ELECTRON_OID}"
          test -f "${OBJECT_PATH}"
          echo "${ELECTRON_OID}  ${OBJECT_PATH}" | sha256sum --check --strict
          git lfs push --object-id origin "${ELECTRON_OID}"
      - name: Prove the object is retrievable from remote LFS
        shell: bash
        run: |
          set -euo pipefail
          OBJECT_PATH=".git/lfs/objects/${ELECTRON_OID:0:2}/${ELECTRON_OID:2:2}/${ELECTRON_OID}"
          rm -f "${OBJECT_PATH}"
          test ! -e "${OBJECT_PATH}"
          git lfs fetch origin --include="${ELECTRON_PATH}" --exclude=""
          test -f "${OBJECT_PATH}"
          echo "${ELECTRON_OID}  ${OBJECT_PATH}" | sha256sum --check --strict
          test "$(stat --format='%s' "${OBJECT_PATH}")" = "${ELECTRON_SIZE}"
