name: OSS-1A Registration ID Zero Full Regression Diagnostics

on:
  push:
    branches:
      - work/oss1a-registration-id-zero-root-fix

permissions:
  contents: read

concurrency:
  group: oss1a-registration-id-zero-full-regression-diagnostics
  cancel-in-progress: false

jobs:
  diagnose-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_SHA: c0cf81de7a0350f2faa1af8877ec4ea16d01e496
      IMPLEMENTATION_BRANCH: oss/1a-baileys-lifecycle
      SEALED_NODE_VERSION: 22.23.1
      TEST_PATH: backend/tests/oss1aWhatsappRegistrationIdZero.test.js
      RESOLVER_PATH: backend/services/whatsappAuthResolver.js
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: false
          lfs: false
          persist-credentials: false

      - name: Set up proven FTS5 Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.SEALED_NODE_VERSION }}
          package-manager-cache: false

      - name: Seal runtime and exact implementation baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node')" = "$SEALED_NODE_VERSION"
          node <<'NODE'
          const { DatabaseSync } = require('node:sqlite');
          const db = new DatabaseSync(':memory:');
          db.exec('CREATE VIRTUAL TABLE full_regression_diagnostic_fts5 USING fts5(value)');
          db.prepare('INSERT INTO full_regression_diagnostic_fts5(value) VALUES (?)').run('sealed');
          const row = db.prepare("SELECT value FROM full_regression_diagnostic_fts5 WHERE full_regression_diagnostic_fts5 MATCH 'sealed'").get();
          if (row?.value !== 'sealed') throw new Error('FTS5 runtime probe failed');
          db.close();
          NODE
          git cat-file -e "${BASE_SHA}^{commit}"
          git fetch --no-tags origin \
            "refs/heads/${IMPLEMENTATION_BRANCH}:refs/remotes/origin/${IMPLEMENTATION_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${IMPLEMENTATION_BRANCH}")" = "$BASE_SHA"
          test -f "$TEST_PATH"
          test -f "$RESOLVER_PATH"

      - name: Build exact root-fix diagnostic worktree
        shell: bash
        run: |
          set -euo pipefail
          worktree="${RUNNER_TEMP}/registration-id-zero-full-regression"
          rm -rf "$worktree"
          git worktree add --detach "$worktree" "$BASE_SHA"
          test "$(git -C "$worktree" rev-parse HEAD)" = "$BASE_SHA"
          install -D -m 0644 "$GITHUB_WORKSPACE/$TEST_PATH" "$worktree/$TEST_PATH"
          install -D -m 0644 "$GITHUB_WORKSPACE/$RESOLVER_PATH" "$worktree/$RESOLVER_PATH"
          {
            echo "DIAGNOSTIC_WORKTREE=$worktree"
            echo "FULL_REGRESSION_LOG=${RUNNER_TEMP}/oss1a-full-regression.log"
          } >> "$GITHUB_ENV"

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$DIAGNOSTIC_WORKTREE"
          npm ci --no-audit --no-fund

      - name: Run full OSS-1A regression once and preserve first failure
        shell: bash
        run: |
          set +e
          set -uo pipefail
          cd "$DIAGNOSTIC_WORKTREE"

          npm run test:oss1a > "$FULL_REGRESSION_LOG" 2>&1
          regression_rc=$?

          first_failure_line="$(grep -n -m1 'not ok' "$FULL_REGRESSION_LOG" | cut -d: -f1)"
          if [ -n "$first_failure_line" ]; then
            start=$(( first_failure_line > 35 ? first_failure_line - 35 : 1 ))
            end=$(( first_failure_line + 110 ))
          else
            total_lines="$(wc -l < "$FULL_REGRESSION_LOG")"
            start=$(( total_lines > 180 ? total_lines - 179 : 1 ))
            end="$total_lines"
          fi

          excerpt="${RUNNER_TEMP}/oss1a-first-failure-excerpt.log"
          sed -n "${start},${end}p" "$FULL_REGRESSION_LOG" > "$excerpt"

          echo "OSS-1A full regression exit: $regression_rc"
          echo "First failure line: ${first_failure_line:-not-found}"
          echo "----- first failure excerpt -----"
          cat "$excerpt"
          echo "----- final test summary -----"
          tail -n 40 "$FULL_REGRESSION_LOG"

          {
            echo "### OSS-1A full regression diagnostic"
            echo
            echo "- Source head: \`$GITHUB_SHA\`"
            echo "- Exact base: \`$BASE_SHA\`"
            echo "- Runtime: Node \`$SEALED_NODE_VERSION\` with proven FTS5"
            echo "- Command: \`npm run test:oss1a\` (executed exactly once)"
            echo "- Exit: \`$regression_rc\`"
            echo "- First failure line: \`${first_failure_line:-not-found}\`"
            echo
            echo '```text'
            cat "$excerpt"
            echo '```'
            echo
            echo "#### Final summary"
            echo '```text'
            tail -n 40 "$FULL_REGRESSION_LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$regression_rc" -ne 0 ]; then
            first_failure="$(grep -m1 'not ok' "$FULL_REGRESSION_LOG" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=OSS-1A full regression failure::${first_failure:-Regression failed; inspect diagnostic excerpt}"
          fi
          exit "$regression_rc"
