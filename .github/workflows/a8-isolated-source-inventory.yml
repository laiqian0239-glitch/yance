name: A8 Isolated Source Inventory

on:
  push:
    branches:
      - acv2/wp-a-a8-batch-root-fix
    paths:
      - .github/workflows/a8-isolated-source-inventory.yml

permissions:
  contents: write

jobs:
  capture-source-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: acv2/wp-a-a8-batch-root-fix
          fetch-depth: 0
          fetch-tags: false
          lfs: false
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Capture exact A8 source-closure violations
        run: |
          mkdir -p .a8
          node - <<'NODE'
          const fs = require('node:fs');
          const { scanRegisteredSources } = require('./tools/architecture-closure-v2/source-closure-scan');
          const report = scanRegisteredSources({ wp: 'A' });
          fs.writeFileSync('.a8/source-closure-current.json', `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify({ ok: report.ok, violationCount: report.violationCount, counts: report.counts }, null, 2));
          if (report.ok || report.violationCount < 1) {
            throw new Error('Expected an open A8 inventory before root-fix implementation');
          }
          NODE

      - name: Commit inventory and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/a8-isolated-source-inventory.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit(a8): capture exact remaining source-closure inventory"
          git push origin HEAD:acv2/wp-a-a8-batch-root-fix
