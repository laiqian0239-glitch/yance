name: OSS-1A Production Regex Diagnostics

on:
  push:
    branches:
      - diagnostic/oss1a-production-regex-fdefafd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      CANDIDATE_HEAD: fdefafd095787477f044f5e791cb95e0aad176f9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Print exact source and regex evidence
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('backend/runtime/AppRuntimeComposition.js', 'utf8');
          const testSource = fs.readFileSync('backend/tests/oss1aWhatsappProductionAuthIntegration.test.js', 'utf8');
          const pattern = /const\s+whatsappAuthRepository\s*=\s*createWhatsAppAuthStateRepository\s*\(/u;
          const start = source.indexOf('const whatsappAuthRepository');
          const fragment = source.slice(start, start + 180);
          console.log('REGEX_SOURCE=' + pattern.source);
          console.log('REGEX_TEST=' + pattern.test(source));
          console.log('START=' + start);
          console.log('FRAGMENT_JSON=' + JSON.stringify(fragment));
          console.log('TEST_REGEX_LINE=' + JSON.stringify(testSource.split('\n').find(line => line.includes('const\\s+whatsappAuthRepository'))));
          NODE
      - name: Run exact test
        run: node --test --test-concurrency=1 backend/tests/oss1aWhatsappProductionAuthIntegration.test.js
