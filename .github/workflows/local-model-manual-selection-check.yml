name: Local Model Manual Selection Check
on:
  push:
    branches:
      - fix/local-model-manual-selection-20261001
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Targeted manual model selection tests
        run: node --test backend/tests/modelBrainManualSelection.test.js tests/wp0/v32-model-brain-manual-selection-20261001.test.js
