name: A8 Isolated Root Fix Batch

on:
  push:
    branches:
      - acv2/wp-a-a8-batch-root-fix
    paths:
      - tools/architecture-closure-v2/a8-root-fix-batch.js
      - .github/workflows/a8-root-fix-batch.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: acv2/wp-a-a8-batch-root-fix
          fetch-depth: 0
          fetch-tags: false
          lfs: false
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Apply constructor-purity and lifecycle-hydration refactor
        run: node tools/architecture-closure-v2/a8-root-fix-batch.js

      - name: Verify syntax
        run: |
          node --check backend/services/aiGateway.js
          node --check backend/runtime/AppRuntimeComposition.js

      - name: Run A6 runtime authority contracts
        run: >-
          node --test --test-concurrency=1
          backend/tests/architectureClosureV2/wpA/runtimeComposition.test.js
          backend/tests/architectureClosureV2/wpA/runtimeGatewaySurface.test.js
          backend/tests/architectureClosureV2/wpA/runtimeStateStoreBinding.test.js
          backend/tests/architectureClosureV2/wpA/runtimeProcessSingleton.test.js
          backend/tests/architectureClosureV2/wpA/startupOrdering.test.js

      - name: Verify patch integrity
        run: |
          git diff --check
          test -z "$(git status --short --untracked-files=all | grep -vE '^.. (tools/architecture-closure-v2/a8-root-fix-batch.js|.github/workflows/a8-root-fix-batch.yml)$' | grep -vE '^ M (backend/services/aiGateway.js|backend/runtime/AppRuntimeComposition.js)$')"

      - name: Commit verified source-only batch
        shell: bash
        run: |
          rm -f tools/architecture-closure-v2/a8-root-fix-batch.js .github/workflows/a8-root-fix-batch.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(a8): hydrate AI routing after authority readiness"
          git push origin HEAD:acv2/wp-a-a8-batch-root-fix
