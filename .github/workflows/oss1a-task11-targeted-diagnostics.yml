name: OSS-1A Task 11 Targeted Diagnostics

on:
  push:
    branches:
      - diagnostic/oss1a-task11-targeted-695cf920

permissions:
  contents: read

jobs:
  targeted-contract:
    name: targeted-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lifecycle
            test_path: backend/tests/oss1aWhatsappAuthLeaseLifecycle.test.js
          - name: production
            test_path: backend/tests/oss1aWhatsappProductionAuthIntegration.test.js
    env:
      BASE_SHA: 62387c011c11c0924ae763f357ce351214e114ce
      SEALED_NODE_VERSION: 22.23.1
    steps:
      - name: Checkout diagnostic orchestration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: false
          lfs: false
          persist-credentials: false

      - name: Set up sealed Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.SEALED_NODE_VERSION }}
          package-manager-cache: false

      - name: Generate and syntax-check exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node')" = "$SEALED_NODE_VERSION"
          worktree="${RUNNER_TEMP}/task11-${{ matrix.name }}"
          git worktree add --detach "$worktree" "$BASE_SHA" >/dev/null
          (cd "$worktree" && npm ci --no-audit --no-fund >/tmp/task11-npm-${{ matrix.name }}.log 2>&1)
          TASK11_TARGET_ROOT="$worktree" node tools/oss1a/generate-task11-auth-lease-candidate.js >/dev/null
          node --check "$worktree/backend/services/whatsappAdapter.js"
          echo "WORKTREE=$worktree" >> "$GITHUB_ENV"

      - name: Run exact ${{ matrix.name }} contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKTREE"
          node --test --test-concurrency=1 "${{ matrix.test_path }}"
