name: WP-A Schema Integrity Root Fix Workspace

on:
  push:
    branches:
      - work/wp-a-schema-integrity-root-fix
    paths:
      - .github/workflows/wp-a-schema-integrity-root-fix.yml
      - tools/architecture-closure-v2/apply-wp-a-schema-integrity-root-fix.js

permissions:
  contents: write

concurrency:
  group: wp-a-schema-integrity-root-fix-workspace
  cancel-in-progress: true

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/wp-a-schema-integrity-root-fix
          fetch-depth: 0
          fetch-tags: false
          lfs: false
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Apply exact root fix
        run: node -e "global.GITHUB_EVENT_NAME = '\${GITHUB_EVENT_NAME}'; require('./tools/architecture-closure-v2/apply-wp-a-schema-integrity-root-fix.js')"

      - name: Verify syntax and locked installation
        run: |
          node --check backend/migrations/architectureClosureV2WpA.js
          node --check backend/migrations/architectureClosureV2WpAIntegrity.js
          node --check backend/services/authorityTransactionCoordinator.js
          node --check backend/tests/architectureClosureV2/wpA/schema22PostMergeIntegrityMigration.test.js
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Reproduce and close the four post-merge failures
        run: |
          node --test --test-concurrency=1 \
            backend/tests/architectureClosureV2/wpA/authorityTransactionCoordinatorIntegrity.test.js \
            backend/tests/architectureClosureV2/wpA/schema21AppendOnlyIntegrity.test.js \
            backend/tests/architectureClosureV2/wpA/schema22PostMergeIntegrityMigration.test.js

      - name: Run the complete portable WP-A matrix
        run: node tools/architecture-closure-v2/run-wp-a-post-merge-contracts.js

      - name: Reverify source closure and governance
        run: |
          node --test --test-concurrency=1 \
            backend/tests/architectureClosureV2/wpA/sourceClosureInventory.test.js \
            backend/tests/architectureClosureV2/wpA/sourceClosureFinal.test.js \
            tests/layered-ci/wp0-routing.test.js \
            tests/wp0/wp-a-post-merge-validation.test.js \
            tests/wp0/github-actions-workflow-syntax.test.js
          node tools/architecture-closure-v2/source-closure-scan.js --wp A
          npm run test:security-scan

      - name: Commit only verified source and governance
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/wp-a-schema-integrity-root-fix.yml \
            tools/architecture-closure-v2/apply-wp-a-schema-integrity-root-fix.js
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(wp-a): close post-merge Schema 21 integrity defects"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin HEAD:work/wp-a-schema-integrity-root-fix
