name: PR17 Governed Error Root Fix

on:
  push:
    branches:
      - work/pr17-governed-error-root-fix

permissions:
  contents: write

concurrency:
  group: pr17-governed-error-root-fix
  cancel-in-progress: false

jobs:
  refactor-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/pr17-governed-error-root-fix
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply governed-error root refactor
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/refactor-pr17-governed-errors.py
          node --check backend/services/durableExecutionAuthority.js
          node --check tools/architecture-closure-v2/capture-wp-b-red-evidence.js
          node --check backend/tests/architectureClosureV2/wpB/durableExecutionCas.test.js
          node --check backend/tests/architectureClosureV2/wpB/m1RedEvidence.test.js

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run focused governed-error regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 backend/tests/architectureClosureV2/wpB/durableExecutionCas.test.js
          node --test --test-concurrency=1 backend/tests/architectureClosureV2/wpB/m1RedEvidence.test.js
          node --test --test-concurrency=1 backend/tests/architectureClosureV2/wpB/schema23SqliteIntegration.test.js
          node --test --test-concurrency=1 backend/tests/architectureClosureV2/wpB/schema23StartupRegistration.test.js
          node tools/architecture-closure-v2/verify-wp-b-m1-red-evidence.js

      - name: Commit verified root fix and remove executor
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/refactor-pr17-governed-errors.py
          rm -f .github/workflows/pr17-governed-error-root-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain=v1)"
          git commit -m "refactor(wp-b): preserve governed Schema 23 failure semantics"
          git push origin HEAD:work/pr17-governed-error-root-fix
