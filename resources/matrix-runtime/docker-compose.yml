# Yance Matrix Runtime — Production Docker Compose
#
# Key design principles:
# - Dynamic host port allocation: no fixed 8008/8080 host bindings.
#   Docker Compose assigns ephemeral host ports; Yance discovers them via
#   `docker compose port <service> <container-port>` after startup.
# - Single stable project authority: yance-runtime (set via --project-name).
# - Persistent user data via named volumes; `down` never uses --volumes.
# - Pre-built materialized images (loaded via `docker load -i matrix-images.tar`).
# - Yance only controls the yance-runtime project; unrelated Docker projects are never touched.

x-synapse-service: &synapse-service { image: "yance-matrix-synapse:${YANCE_MATRIX_IMAGE_TAG:-release}" }
x-mautrix-whatsapp-service: &mautrix-whatsapp-service { image: "yance-matrix-mautrix-whatsapp:${YANCE_MATRIX_IMAGE_TAG:-release}" }
x-mautrix-meta-service: &mautrix-meta-service { image: "yance-matrix-mautrix-meta:${YANCE_MATRIX_IMAGE_TAG:-release}" }
x-element-service: &element-service { image: "yance-matrix-element:${YANCE_MATRIX_IMAGE_TAG:-release}" }

services:
  matrix-secret-projection:
    <<: *synapse-service
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cp /bootstrap/matrix-registration-shared-secret /projected/matrix/yance_matrix_registration_shared_secret
        chown 991:991 /projected/matrix/yance_matrix_registration_shared_secret
        chmod 0400 /projected/matrix/yance_matrix_registration_shared_secret
        cp /bootstrap/mautrix-meta-provisioning-secret /projected/meta/yance_mautrix_meta_provisioning_secret
        chown 1337:1337 /projected/meta/yance_mautrix_meta_provisioning_secret
        chmod 0400 /projected/meta/yance_mautrix_meta_provisioning_secret
    volumes:
      - type: bind
        source: ${YANCE_MATRIX_REGISTRATION_SHARED_SECRET_FILE:?required}
        target: /bootstrap/matrix-registration-shared-secret
        read_only: true
      - type: bind
        source: ${YANCE_MAUTRIX_META_PROVISIONING_SECRET_FILE:?required}
        target: /bootstrap/mautrix-meta-provisioning-secret
        read_only: true
      - synapse-secret-data:/projected/matrix
      - mautrix-meta-secret-data:/projected/meta
    restart: "no"

  synapse-data-init:
    <<: *synapse-service
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        chown -R 991:991 /data
        chmod -R u+rwX /data
        if [ ! -f /data/log.config ]; then
          printf '%s\n' \
            'version: 1' \
            'formatters:' \
            '    precise:' \
            "        format: '%(asctime)s - %(name)s - %(lineno)d - %(levelname)s - %(request)s - %(message)s'" \
            'handlers:' \
            '    file:' \
            '        class: logging.handlers.TimedRotatingFileHandler' \
            '        formatter: precise' \
            '        filename: /data/homeserver.log' \
            '        when: midnight' \
            '        backupCount: 3' \
            '        encoding: utf8' \
            '    buffer:' \
            '        class: synapse.logging.handlers.PeriodicallyFlushingMemoryHandler' \
            '        target: file' \
            '        capacity: 10' \
            '        flushLevel: 30' \
            '        period: 5' \
            '    console:' \
            '        class: logging.StreamHandler' \
            '        formatter: precise' \
            'loggers:' \
            '    synapse.storage.SQL:' \
            '        level: INFO' \
            'root:' \
            '    level: INFO' \
            '    handlers: [buffer]' \
            'disable_existing_loggers: false' \
            > /data/log.config
          chown 991:991 /data/log.config
          chmod 0644 /data/log.config
        fi
    volumes:
      - synapse-data:/data
    restart: "no"

  mautrix-meta-registration:
    <<: *mautrix-meta-service
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -f /data/config.yaml ]; then
          cp /bootstrap/config.yaml /data/config.yaml
        fi
        if [ ! -f /data/registration.yaml ]; then
          /usr/bin/mautrix-meta -g -c /data/config.yaml -r /data/registration.yaml
        fi
        chown -R 1337:1337 /data
        chmod 0644 /data/config.yaml /data/registration.yaml
    environment:
      YANCE_MAUTRIX_META_PROVISIONING__SHARED_SECRET_FILE: /run/secrets/yance_mautrix_meta_provisioning_secret
    volumes:
      - ./matrix-config/mautrix-meta/config.yaml:/bootstrap/config.yaml:ro
      - mautrix-meta-secret-data:/run/secrets:ro
      - mautrix-meta-data:/data
    depends_on:
      matrix-secret-projection:
        condition: service_completed_successfully
    restart: "no"

  mautrix-whatsapp-registration:
    <<: *mautrix-whatsapp-service
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -f /data/config.yaml ]; then
          cp /bootstrap/config.yaml /data/config.yaml
        fi
        if [ ! -f /data/registration.yaml ]; then
          /usr/bin/mautrix-whatsapp -g -c /data/config.yaml -r /data/registration.yaml
        fi
        chown -R 1337:1337 /data
        chmod 0644 /data/config.yaml /data/registration.yaml
    volumes:
      - ./matrix-config/mautrix-whatsapp/config.yaml:/bootstrap/config.yaml:ro
      - mautrix-whatsapp-data:/data
    restart: "no"

  synapse:
    <<: *synapse-service
    command: ["run"]
    volumes:
      - ./matrix-config/synapse/homeserver.yaml:/data/homeserver.yaml:ro
      - synapse-data:/data
      - mautrix-meta-data:/mautrix-meta:ro
      - mautrix-whatsapp-data:/mautrix-whatsapp:ro
      - synapse-secret-data:/run/secrets:ro
    # Dynamic host port: Docker Compose assigns an ephemeral host port.
    # Yance discovers the actual port via `docker compose port synapse 8008`.
    ports:
      - "127.0.0.1::8008"
    depends_on:
      matrix-secret-projection:
        condition: service_completed_successfully
      synapse-data-init:
        condition: service_completed_successfully
      mautrix-meta-registration:
        condition: service_completed_successfully
      mautrix-whatsapp-registration:
        condition: service_completed_successfully

  element:
    <<: *element-service
    volumes:
      - ./matrix-config/element-config.json:/app/config.json:ro
    # Dynamic host port: Docker Compose assigns an ephemeral host port.
    # Yance discovers the actual port via `docker compose port element 80`.
    ports:
      - "127.0.0.1::80"
    depends_on:
      - synapse

  mautrix-whatsapp:
    <<: *mautrix-whatsapp-service
    volumes:
      - mautrix-whatsapp-data:/data
    depends_on:
      synapse:
        condition: service_started
      mautrix-whatsapp-registration:
        condition: service_completed_successfully

  mautrix-meta:
    <<: *mautrix-meta-service
    environment:
      YANCE_MAUTRIX_META_PROVISIONING__SHARED_SECRET_FILE: /run/secrets/yance_mautrix_meta_provisioning_secret
    volumes:
      - mautrix-meta-secret-data:/run/secrets:ro
      - mautrix-meta-data:/data
    depends_on:
      matrix-secret-projection:
        condition: service_completed_successfully
      synapse:
        condition: service_started
      mautrix-meta-registration:
        condition: service_completed_successfully

volumes:
  synapse-data:
  mautrix-whatsapp-data:
  mautrix-meta-data:
  synapse-secret-data:
  mautrix-meta-secret-data:
