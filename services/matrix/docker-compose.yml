x-mautrix-whatsapp-service: &mautrix-whatsapp-service
  build:
    context: ./.runtime/mautrix-whatsapp

x-mautrix-telegram-service: &mautrix-telegram-service
  build:
    context: ./.runtime/mautrix-telegram

services:
  matrix-secret-projection:
    build:
      context: ./.runtime/synapse
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cp /bootstrap/matrix-registration-shared-secret /projected/matrix/yance_matrix_registration_shared_secret
        chown 991:991 /projected/matrix/yance_matrix_registration_shared_secret
        chmod 0400 /projected/matrix/yance_matrix_registration_shared_secret
        jwt_secret="$(cat /bootstrap/matrix-registration-shared-secret)"
        python -c 'import sys; secret = sys.argv[1]; print("jwt_config:"); print("  enabled: true"); print("  secret: " + repr(secret)); print("  algorithm: HS256"); print("  issuer: yance-personal-access"); print("  audiences:"); print("    - yance.local")' "$$jwt_secret" > /projected/matrix/yance_jwt_config.yaml
        chown 991:991 /projected/matrix/yance_jwt_config.yaml
        chmod 0400 /projected/matrix/yance_jwt_config.yaml
        cp /bootstrap/mautrix-meta-provisioning-secret /projected/meta/yance_mautrix_meta_provisioning_secret
        chown 1337:1337 /projected/meta/yance_mautrix_meta_provisioning_secret
        chmod 0400 /projected/meta/yance_mautrix_meta_provisioning_secret
        cp /bootstrap/mautrix-whatsapp-provisioning-secret /projected/whatsapp/yance_mautrix_whatsapp_provisioning_secret
        chown 1337:1337 /projected/whatsapp/yance_mautrix_whatsapp_provisioning_secret
        chmod 0400 /projected/whatsapp/yance_mautrix_whatsapp_provisioning_secret
        cp /bootstrap/mautrix-telegram-provisioning-secret /projected/telegram/yance_mautrix_telegram_provisioning_secret
        chown 1337:1337 /projected/telegram/yance_mautrix_telegram_provisioning_secret
        chmod 0400 /projected/telegram/yance_mautrix_telegram_provisioning_secret
    volumes:
      - type: bind
        source: ${YANCE_MATRIX_REGISTRATION_SHARED_SECRET_FILE:?required}
        target: /bootstrap/matrix-registration-shared-secret
        read_only: true
      - type: bind
        source: ${YANCE_MAUTRIX_META_PROVISIONING_SECRET_FILE:?required}
        target: /bootstrap/mautrix-meta-provisioning-secret
        read_only: true
      - type: bind
        source: ${YANCE_MAUTRIX_WHATSAPP_PROVISIONING_SECRET_FILE:?required}
        target: /bootstrap/mautrix-whatsapp-provisioning-secret
        read_only: true
      - type: bind
        source: ${YANCE_MAUTRIX_TELEGRAM_PROVISIONING_SECRET_FILE:?required}
        target: /bootstrap/mautrix-telegram-provisioning-secret
        read_only: true
      - synapse-secret-data:/projected/matrix
      - mautrix-meta-secret-data:/projected/meta
      - mautrix-whatsapp-secret-data:/projected/whatsapp
      - mautrix-telegram-secret-data:/projected/telegram
    restart: "no"

  synapse-data-init:
    build:
      context: ./.runtime/synapse
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        chown -R 991:991 /data
        chmod -R u+rwX /data
        # Synapse auto-generates log.config with filename /homeserver.log, i.e. the
        # container root. Runtime UID 991 cannot create a file there, so Synapse
        # dies with "Unable to configure handler 'file'". Seed an explicit log
        # config that writes inside the writable /data volume instead.
        if [ ! -f /data/log.config ]; then
          printf '%s\n' \
            'version: 1' \
            'formatters:' \
            '    precise:' \
            "        format: '%(asctime)s - %(name)s - %(lineno)d - %(levelname)s - %(request)s - %(message)s'" \
            'handlers:' \
            '    file:' \
            '        class: logging.handlers.TimedRotatingFileHandler' \
            '        formatter: precise' \
            '        filename: /data/homeserver.log' \
            '        when: midnight' \
            '        backupCount: 3' \
            '        encoding: utf8' \
            '    buffer:' \
            '        class: synapse.logging.handlers.PeriodicallyFlushingMemoryHandler' \
            '        target: file' \
            '        capacity: 10' \
            '        flushLevel: 30' \
            '        period: 5' \
            '    console:' \
            '        class: logging.StreamHandler' \
            '        formatter: precise' \
            'loggers:' \
            '    synapse.storage.SQL:' \
            '        level: INFO' \
            'root:' \
            '    level: INFO' \
            '    handlers: [buffer]' \
            'disable_existing_loggers: false' \
            > /data/log.config
          chown 991:991 /data/log.config
          chmod 0644 /data/log.config
        fi
    volumes:
      - synapse-data:/data
    restart: "no"

  mautrix-meta-registration:
    build:
      context: ./.runtime/mautrix-meta
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -f /data/config.yaml ]; then
          cp /bootstrap/config.yaml /data/config.yaml
        fi
        if [ ! -f /data/registration.yaml ]; then
          /usr/bin/mautrix-meta -g -c /data/config.yaml -r /data/registration.yaml
        fi
        chown -R 1337:1337 /data
        chmod 0644 /data/config.yaml /data/registration.yaml
    environment:
      YANCE_MAUTRIX_META_PROVISIONING__SHARED_SECRET_FILE: /run/secrets/yance_mautrix_meta_provisioning_secret
    volumes:
      - ../../config/matrix/mautrix-meta/config.yaml:/bootstrap/config.yaml:ro
      - mautrix-meta-secret-data:/run/secrets:ro
      - mautrix-meta-data:/data
    depends_on:
      matrix-secret-projection:
        condition: service_completed_successfully
    restart: "no"

  mautrix-whatsapp-registration:
    <<: *mautrix-whatsapp-service
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -f /data/config.yaml ]; then
          cp /bootstrap/config.yaml /data/config.yaml
        fi
        if [ ! -f /data/registration.yaml ]; then
          /usr/bin/mautrix-whatsapp -g -c /data/config.yaml -r /data/registration.yaml
        fi
        chown -R 1337:1337 /data
        chmod 0644 /data/config.yaml /data/registration.yaml
    environment:
      YANCE_MAUTRIX_WHATSAPP_PROVISIONING__SHARED_SECRET_FILE: /run/secrets/yance_mautrix_whatsapp_provisioning_secret
    volumes:
      - ../../config/matrix/mautrix-whatsapp/config.yaml:/bootstrap/config.yaml:ro
      - mautrix-whatsapp-secret-data:/run/secrets:ro
      - mautrix-whatsapp-data:/data
    depends_on:
      matrix-secret-projection:
        condition: service_completed_successfully
    restart: "no"

  mautrix-telegram-registration:
    <<: *mautrix-telegram-service
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -f /data/config.yaml ]; then
          cp /bootstrap/config.yaml /data/config.yaml
        fi
        if [ ! -f /data/registration.yaml ]; then
          /usr/bin/mautrix-telegram -g -c /data/config.yaml -r /data/registration.yaml
        fi
        chown -R 1337:1337 /data
        chmod 0644 /data/config.yaml /data/registration.yaml
    environment:
      YANCE_MAUTRIX_TELEGRAM_NETWORK__API_ID: ${YANCE_TELEGRAM_API_ID:?required}
      YANCE_MAUTRIX_TELEGRAM_NETWORK__API_HASH: ${YANCE_TELEGRAM_API_HASH:?required}
      YANCE_MAUTRIX_TELEGRAM_PROVISIONING__SHARED_SECRET_FILE: /run/secrets/yance_mautrix_telegram_provisioning_secret
    volumes:
      - ../../config/matrix/mautrix-telegram/config.yaml:/bootstrap/config.yaml:ro
      - mautrix-telegram-secret-data:/run/secrets:ro
      - mautrix-telegram-data:/data
    depends_on:
      matrix-secret-projection:
        condition: service_completed_successfully
    restart: "no"

  synapse:
    build:
      context: ./.runtime/synapse
    command: ["run", "--config-path", "/data/homeserver.yaml", "--config-path", "/run/secrets/yance_jwt_config.yaml"]
    volumes:
      - ../../config/matrix/synapse/homeserver.yaml:/data/homeserver.yaml:ro
      - synapse-data:/data
      - mautrix-meta-data:/mautrix-meta:ro
      - mautrix-whatsapp-data:/mautrix-whatsapp:ro
      - mautrix-telegram-data:/mautrix-telegram:ro
      - synapse-secret-data:/run/secrets:ro
    ports:
      - "127.0.0.1:8008:8008"
    depends_on:
      matrix-secret-projection:
        condition: service_completed_successfully
      synapse-data-init:
        condition: service_completed_successfully
      mautrix-meta-registration:
        condition: service_completed_successfully
      mautrix-whatsapp-registration:
        condition: service_completed_successfully
      mautrix-telegram-registration:
        condition: service_completed_successfully

  element:
    build:
      context: ./.runtime/element-web
    volumes:
      - ../../config/matrix/element-config.json:/app/config.json:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - synapse

  mautrix-whatsapp:
    <<: *mautrix-whatsapp-service
    environment:
      YANCE_MAUTRIX_WHATSAPP_PROVISIONING__SHARED_SECRET_FILE: /run/secrets/yance_mautrix_whatsapp_provisioning_secret
    volumes:
      - mautrix-whatsapp-secret-data:/run/secrets:ro
      - mautrix-whatsapp-data:/data
    ports:
      - "${YANCE_MATRIX_MAUTRIX_WHATSAPP_PORT_BINDING:-127.0.0.1::29318}"
    depends_on:
      matrix-secret-projection:
        condition: service_completed_successfully
      synapse:
        condition: service_started
      mautrix-whatsapp-registration:
        condition: service_completed_successfully

  mautrix-telegram:
    <<: *mautrix-telegram-service
    environment:
      YANCE_MAUTRIX_TELEGRAM_NETWORK__API_ID: ${YANCE_TELEGRAM_API_ID:?required}
      YANCE_MAUTRIX_TELEGRAM_NETWORK__API_HASH: ${YANCE_TELEGRAM_API_HASH:?required}
      YANCE_MAUTRIX_TELEGRAM_PROVISIONING__SHARED_SECRET_FILE: /run/secrets/yance_mautrix_telegram_provisioning_secret
    volumes:
      - mautrix-telegram-secret-data:/run/secrets:ro
      - mautrix-telegram-data:/data
    ports:
      - "${YANCE_MATRIX_MAUTRIX_TELEGRAM_PORT_BINDING:-127.0.0.1::29317}"
    depends_on:
      matrix-secret-projection:
        condition: service_completed_successfully
      synapse:
        condition: service_started
      mautrix-telegram-registration:
        condition: service_completed_successfully

  mautrix-meta:
    build:
      context: ./.runtime/mautrix-meta
    environment:
      YANCE_MAUTRIX_META_PROVISIONING__SHARED_SECRET_FILE: /run/secrets/yance_mautrix_meta_provisioning_secret
    volumes:
      - mautrix-meta-secret-data:/run/secrets:ro
      - mautrix-meta-data:/data
    ports:
      - "${YANCE_MATRIX_MAUTRIX_META_PORT_BINDING:-127.0.0.1::29319}"
    depends_on:
      matrix-secret-projection:
        condition: service_completed_successfully
      synapse:
        condition: service_started
      mautrix-meta-registration:
        condition: service_completed_successfully

volumes:
  synapse-data:
  mautrix-whatsapp-data:
  mautrix-telegram-data:
  mautrix-meta-data:
  synapse-secret-data:
  mautrix-meta-secret-data:
  mautrix-whatsapp-secret-data:
  mautrix-telegram-secret-data:
