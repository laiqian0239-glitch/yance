x-mautrix-whatsapp-service: &mautrix-whatsapp-service
  build:
    context: ./.runtime/mautrix-whatsapp

services:
  matrix-secret-projection:
    build:
      context: ./.runtime/synapse
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cp /bootstrap/matrix-registration-shared-secret /projected/matrix/yance_matrix_registration_shared_secret
        chown 991:991 /projected/matrix/yance_matrix_registration_shared_secret
        chmod 0400 /projected/matrix/yance_matrix_registration_shared_secret
        cp /bootstrap/mautrix-meta-provisioning-secret /projected/meta/yance_mautrix_meta_provisioning_secret
        chown 1337:1337 /projected/meta/yance_mautrix_meta_provisioning_secret
        chmod 0400 /projected/meta/yance_mautrix_meta_provisioning_secret
    volumes:
      - type: bind
        source: ${YANCE_MATRIX_REGISTRATION_SHARED_SECRET_FILE:?required}
        target: /bootstrap/matrix-registration-shared-secret
        read_only: true
      - type: bind
        source: ${YANCE_MAUTRIX_META_PROVISIONING_SECRET_FILE:?required}
        target: /bootstrap/mautrix-meta-provisioning-secret
        read_only: true
      - synapse-secret-data:/projected/matrix
      - mautrix-meta-secret-data:/projected/meta
    restart: "no"

  synapse-data-init:
    build:
      context: ./.runtime/synapse
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        chown -R 991:991 /data
        chmod -R u+rwX /data
    volumes:
      - synapse-data:/data
    restart: "no"

  mautrix-meta-registration:
    build:
      context: ./.runtime/mautrix-meta
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -f /data/config.yaml ]; then
          cp /bootstrap/config.yaml /data/config.yaml
        fi
        if [ ! -f /data/registration.yaml ]; then
          /usr/bin/mautrix-meta -g -c /data/config.yaml -r /data/registration.yaml
        fi
        chown -R 1337:1337 /data
        chmod 0644 /data/config.yaml /data/registration.yaml
    environment:
      YANCE_MAUTRIX_META_PROVISIONING__SHARED_SECRET_FILE: /run/secrets/yance_mautrix_meta_provisioning_secret
    volumes:
      - ../../config/matrix/mautrix-meta/config.yaml:/bootstrap/config.yaml:ro
      - mautrix-meta-secret-data:/run/secrets:ro
      - mautrix-meta-data:/data
    depends_on:
      matrix-secret-projection:
        condition: service_completed_successfully
    restart: "no"

  mautrix-whatsapp-registration:
    <<: *mautrix-whatsapp-service
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -f /data/config.yaml ]; then
          cp /bootstrap/config.yaml /data/config.yaml
        fi
        if [ ! -f /data/registration.yaml ]; then
          /usr/bin/mautrix-whatsapp -g -c /data/config.yaml -r /data/registration.yaml
        fi
        chown -R 1337:1337 /data
        chmod 0644 /data/config.yaml /data/registration.yaml
    volumes:
      - ../../config/matrix/mautrix-whatsapp/config.yaml:/bootstrap/config.yaml:ro
      - mautrix-whatsapp-data:/data
    restart: "no"

  synapse:
    build:
      context: ./.runtime/synapse
    command: ["run"]
    volumes:
      - ../../config/matrix/synapse/homeserver.yaml:/data/homeserver.yaml:ro
      - synapse-data:/data
      - mautrix-meta-data:/mautrix-meta:ro
      - mautrix-whatsapp-data:/mautrix-whatsapp:ro
      - synapse-secret-data:/run/secrets:ro
    ports:
      - "127.0.0.1:8008:8008"
    depends_on:
      matrix-secret-projection:
        condition: service_completed_successfully
      synapse-data-init:
        condition: service_completed_successfully
      mautrix-meta-registration:
        condition: service_completed_successfully
      mautrix-whatsapp-registration:
        condition: service_completed_successfully

  element:
    build:
      context: ./.runtime/element-web
    volumes:
      - ../../config/matrix/element-config.json:/app/config.json:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - synapse

  mautrix-whatsapp:
    <<: *mautrix-whatsapp-service
    volumes:
      - mautrix-whatsapp-data:/data
    depends_on:
      synapse:
        condition: service_started
      mautrix-whatsapp-registration:
        condition: service_completed_successfully

  mautrix-meta:
    build:
      context: ./.runtime/mautrix-meta
    environment:
      YANCE_MAUTRIX_META_PROVISIONING__SHARED_SECRET_FILE: /run/secrets/yance_mautrix_meta_provisioning_secret
    volumes:
      - mautrix-meta-secret-data:/run/secrets:ro
      - mautrix-meta-data:/data
    depends_on:
      matrix-secret-projection:
        condition: service_completed_successfully
      synapse:
        condition: service_started
      mautrix-meta-registration:
        condition: service_completed_successfully

volumes:
  synapse-data:
  mautrix-whatsapp-data:
  mautrix-meta-data:
  synapse-secret-data:
  mautrix-meta-secret-data:
